query articleSuggest($q: String!) {
  suggest(q: $q, workType: ARTICLE, limit: 10) {
    result {
      type
      term
      work {
        workId
        titles {
          main
        }
        creators {
          display
        }
        manifestations {
          bestRepresentation {
            hostPublication {
              title
            }
          }
        }
      }
    }
  }
}
