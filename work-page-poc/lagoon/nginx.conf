server {
  listen 8080 default_server;

  include /etc/nginx/helpers/*.conf;

  root /app;
  index index.html;

  # A client-side routed app: unknown paths such as /work/<id> get index.html
  # and React Router takes it from there.
  location / {
    try_files $uri /index.html;
  }

  # Hashed build output: a missing file is a real 404, not the app shell.
  location /assets/ {
    try_files $uri =404;
  }
}
