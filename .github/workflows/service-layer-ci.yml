---
name: Service Layer / CI

on:
  pull_request:
    paths:
      - "packages/**"
      - "schemas/openapi/fbs-adapter.yaml"
      - ".github/workflows/service-layer-ci.yml"

concurrency:
  group: ${{ github.repository_id }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job: install takes minutes, each check seconds.
  # Checks run despite earlier failures, so one run reports all.
  Checks:
    name: Service Layer / Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/service-layer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/common-setup-js
        id: setup
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
      - name: Type check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run typecheck
      - name: Unit test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run test
      - name: Format check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run format:check
      - name: Lint check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run lint
      - name: Re-run FBS codegen
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run codegen:fbs
      - name: Verify generated files match the spec
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          if ! git diff --exit-code -- fbs/src/generated; then
            echo "::error::Generated FBS files are out of date with fbs-adapter.yaml. Run 'pnpm run codegen:fbs' inside packages/service-layer and commit the result."
            exit 1
          fi
