name: Design / Argos

on:
  push:
    branches:
      # Required for creating baselines
      - main
      - develop
      - release/*
    paths:
      - 'design-system/**'
      - '.github/workflows/design-system-argos.yml'
  pull_request:
    paths:
      - 'design-system/**'
      - '.github/workflows/design-system-argos.yml'
    types: [ready_for_review, opened, synchronize]

# Detect if this action is already running, and cancel it.
# This most likely happened because a second push has been made to a branch.
concurrency:
  # Every push build is an Argos baseline, so pushes get a group per commit:
  # a group also replaces its pending run, cancel-in-progress or not.
  group: ${{ github.repository_id }}-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  argos:
    # Pull requests from forks get no secrets, so they cannot upload.
    if: github.event_name == 'push' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design-system
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}

      - name: Install go-task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Take screenshots
        run: task argos:capture

      # The CLI directly, not through pnpm: pnpm in the capture's container
      # reinstalled node_modules, and pnpm here would then reinstall them
      # again.
      - name: Upload screenshots to Argos
        run: node_modules/.bin/argos upload --build-name design-system ./screenshots
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}

      - name: Deploy Storybook preview to Argos
        # Also when capturing failed, as the preview helps debug that.
        if: ${{ !cancelled() && hashFiles('design-system/storybook-static/index.html') != '' }}
        run: node_modules/.bin/argos deploy ./storybook-static
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
