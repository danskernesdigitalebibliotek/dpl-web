---
name: Go / Build base image

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[a-z]+.[0-9]+'
  workflow_call:
    secrets:
      WEDOBOOKS_NPM_TOKEN:
        description: >-
          Token for WeDoBooks' private npm registry. stage1.dockerfile takes
          it as a BuildKit secret for the pnpm install. Callers pass it with
          `secrets: inherit`.
        required: true

env:
  DOCKER_REGISTRY: ghcr.io
  GO_IMAGE_NAME: '${{ github.repository }}-go'

jobs:
  BuildGoBaseImage:
    name: Go / Build base image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.GO_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          file: "go/lagoon/stage1.dockerfile"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DPL_VERSION=${{ steps.meta.outputs.version }}
          # A BuildKit secret, not a build argument: this Dockerfile has a
          # single stage and that stage is what gets published, so a build
          # argument would be readable from `docker history`.
          secrets: |
            WEDOBOOKS_NPM_TOKEN=${{ secrets.WEDOBOOKS_NPM_TOKEN }}
