name: React / CI

# The design-system is built ONCE in the `design-system` job and shared with
# every build-consuming job via an artifact, instead of each job rebuilding it.
# Jobs that only need node_modules (lint, typecheck, codegen) skip that
# dependency entirely and start immediately.

on:
  push:
    # Only run on long-lived branches (or on pull request events, below).
    branches:
      - main
      - develop
      - release/*
    paths:
      - "react/**"
      - ".github/workflows/react-ci.yml"
      - ".github/actions/**"
      - "schemas/openapi/**"
      - "schemas/graphql/dbc-fbi.graphql"
      - "cms/openapi.json"
  pull_request:
    paths:
      - "react/**"
      - ".github/workflows/react-ci.yml"
      - ".github/actions/**"
      - "schemas/openapi/**"
      - "schemas/graphql/dbc-fbi.graphql"
      - "cms/openapi.json"

jobs:
  # ---------------------------------------------------------------------------
  # Build the design-system once. Everything downstream downloads this artifact
  # instead of running `task dev:design-system:build` itself.
  # ---------------------------------------------------------------------------
  design-system:
    name: React / Build design-system
    if: "!github.event.deleted"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-design-system
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
      - name: Upload design-system build
        uses: actions/upload-artifact@v6
        with:
          name: design-system-build
          path: design-system/build
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Lint / typecheck / codegen — mostly only need node_modules (pnpm cache), so
  # they do NOT depend on the design-system job and run in parallel from the
  # start. The exception is eslint: `import/no-unresolved` resolves React's
  # imports of `@danskernesdigitalebibliotek/dpl-design-system/build/*` against
  # the filesystem, and since the design-system is a workspace dependency its
  # `build/` only exists once built — so the eslint job consumes the shared
  # design-system build artifact (see below).
  # PR-only, matching the original react-pull_request.yml / react-codegen.yml.
  # ---------------------------------------------------------------------------
  stylelint:
    name: React / Lint .scss
    if: github.event_name == 'pull_request' && !github.event.deleted
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
      - name: stylelint
        uses: reviewdog/action-stylelint@v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
          stylelint_input: "src/**/*.scss"
          workdir: "react"
      - name: Lint SCSS
        run: pnpm run lint:scss

  typescript:
    name: React / Typescript compile check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
          build-wedobooks: 'true'
      - name: Run typescript compile check
        run: pnpm exec tsc --noEmit

  eslint:
    name: React / Lint .js and .jsx
    # Needs the design-system build so import/no-unresolved can resolve React's
    # imports from @danskernesdigitalebibliotek/dpl-design-system/build/*.
    needs: design-system
    if: github.event_name == 'pull_request' && !github.event.deleted
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
          build-wedobooks: 'true'
      - name: Download design-system build
        uses: actions/download-artifact@v6
        with:
          name: design-system-build
          path: design-system/build
      - name: eslint
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
          eslint_flags: "."
          workdir: react
      - name: Lint Javascript
        run: pnpm run lint:js

  markdownlint:
    name: React / Lint markdown
    if: github.event_name == 'pull_request' && !github.event.deleted
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
      - name: Install problem matcher
        uses: xt0rted/markdownlint-problem-matcher@v3
      - name: Lint markdown
        run: pnpm run lint:markdown

  codegen:
    name: React / Generated clients
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository_id }}-${{ github.workflow }}-codegen-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
      - name: Install go-task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Codegen - DBC gateway GraphQL
        run: task codegen:dbc:gateway
      - name: Codegen - REST services
        run: task codegen:rest-services
      - name: Codegen - FBS client
        run: task codegen:client:fbs
      - name: Codegen - Publizon client
        run: task codegen:client:publizon
      - name: Codegen - dpl-cms client
        run: task codegen:client:dpl-cms
      - name: Ensure generated client code has not drifted
        run: git diff --exit-code

  # ---------------------------------------------------------------------------
  # Build-consuming jobs: depend on the single design-system build and download
  # it into design-system/build, where the workspace symlink resolves it.
  # ---------------------------------------------------------------------------
  integration:
    name: React / Integration test
    needs: design-system
    if: >-
      !github.event.deleted &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Copenhagen
    strategy:
      # One failing machine must not hide the others' results.
      fail-fast: false
      matrix:
        # cypress-split (react/cypress.config.js) gives each machine a slice.
        containers: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
          build-wedobooks: 'true'
      - name: Download design-system build
        uses: actions/download-artifact@v6
        with:
          name: design-system-build
          path: design-system/build

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: pnpm run start:storybook:test
          wait-on: "http://localhost:57021"
          browser: ${{ steps.setup-chrome.outputs.chrome-path }}
          working-directory: react
        env:
          SPLIT: ${{ strategy.job-total }}
          SPLIT_INDEX: ${{ strategy.job-index }}
          # Balance by duration; a spec missing from it counts as the average.
          # Refreshed by integration-timings.
          SPLIT_FILE: cypress/timings.json
          # Leaves the committed file untouched.
          SPLIT_OUTPUT_FILE: cypress/timings-out.json
      # For integration-timings.
      - name: Upload spec timings
        if: success() && github.event_name == 'push' && github.ref_name == 'develop'
        uses: actions/upload-artifact@v6
        with:
          name: cypress-timings-${{ matrix.containers }}
          path: react/cypress/timings-out.json
          retention-days: 1
          if-no-files-found: error
      - name: Upload screenshots
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.containers }}
          path: react/cypress/screenshots
      - name: Upload videos
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cypress-videos-${{ matrix.containers }}
          path: react/cypress/videos
      - run: mkdir -p .nyc_output
        working-directory: react
      - name: Generate code coverage report
        run: pnpm exec nyc report --reporter=clover --reporter=text --report-dir=./coverage
        working-directory: react
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: react/coverage/
          flags: integration
          fail_ci_if_error: false

  # Refreshes react/cypress/timings.json at most weekly from a green develop
  # run. Committed, not cached: every machine of a run must split from the
  # same file, or specs get skipped.
  integration-timings:
    name: React / Merge integration test timings
    needs: integration
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          persist-credentials: false
      - id: merge
        uses: ./.github/actions/merge-cypress-timings
        with:
          working-directory: react
          artifact-pattern: cypress-timings-*
          github-token: ${{ github.token }}

  # The bot token bypasses develop's pull request rule, as for translations.
  # Own job: keeps the token away from the npm code the merge runs.
  integration-timings-commit:
    name: React / Commit integration test timings
    needs: integration-timings
    if: needs.integration-timings.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One commit at a time.
    concurrency:
      group: ${{ github.repository_id }}-react-cypress-timings
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          token: ${{ secrets.AUTOCOMMIT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v6
        with:
          name: cypress-timings-merged
          path: react/cypress
      # [skip ci] skips push-triggered workflows, Lagoon / Deploy included.
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: react/cypress/timings.json
          commit_message: Refresh React Cypress spec timings [skip ci]
          # Rebase onto anything newer on develop.
          before_push_hook: |
            git pull --rebase

  unit:
    name: React / Unit test
    needs: design-system
    if: "!github.event.deleted"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
          build-wedobooks: 'true'
      - name: Download design-system build
        uses: actions/download-artifact@v6
        with:
          name: design-system-build
          path: design-system/build
      - name: Run unit tests
        run: pnpm run test:unit
        working-directory: react

  relative-ci:
    name: React / Build artifacts
    needs: design-system
    if: "!github.event.deleted"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v7
        with:
          # Required to fetch all commits and tags
          fetch-depth: 0
      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
          build-wedobooks: 'true'
      - name: Download design-system build
        uses: actions/download-artifact@v6
        with:
          name: design-system-build
          path: design-system/build
      - name: Build artifacts
        run: |
          pnpm run build:css:prod
          VERSION_FILE_NAME=$GITHUB_REPOSITORY \
          VERSION_FILE_VERSION=$(git describe --tags --exclude=latest) \
          pnpm run build:js:prod --json webpack-stats.json
      - name: Send webpack stats to RelativeCI
        uses: relative-ci/agent-action@v3
        with:
          key: ${{ secrets.RELATIVE_CI_KEY_REACT }}
          token: ${{ secrets.GITHUB_TOKEN }}
          webpackStatsFile: ./react/webpack-stats.json

  github-pages:
    name: React / GitHub pages
    needs: design-system
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
          build-wedobooks: 'true'
      - name: Download design-system build
        uses: actions/download-artifact@v6
        with:
          name: design-system-build
          path: design-system/build
      - run: pnpm run build:storybook
        working-directory: react
        env:
          STORYBOOK_CLIENT_ID: ${{ secrets.STORYBOOK_CLIENT_ID }}
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./react/dev
          destination_dir: react
          # Don't wipe out other projects folder when deploying this.
          keep_files: true
