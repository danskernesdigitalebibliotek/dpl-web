name: Design / Lint

on:
  pull_request:
    paths:
      - 'design-system/**'
      - '.github/workflows/design-system-*.yml'
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  push:
    branches:
      - main
    paths:
      - 'design-system/**'
      - '.github/workflows/design-system-*.yml'
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

jobs:
  # One job: install takes minutes, each linter seconds.
  # Linters run despite earlier failures, so one run reports all.
  lint:
    name: Design / Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design-system
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/common-setup-js
        id: setup
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
      - name: Run css:lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run css:lint
      - name: Run js:lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run js:lint
      - name: Run markdown:lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run markdown:lint
