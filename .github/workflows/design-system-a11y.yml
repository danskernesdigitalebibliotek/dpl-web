name: Design / Accessibility

on:
  pull_request:
    paths:
      - 'design-system/**'
      - '.github/workflows/design-system-*.yml'
  push:
    branches:
      - main
    paths:
      - 'design-system/**'
      - '.github/workflows/design-system-*.yml'

jobs:
  a11y:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design-system
    steps:
      - uses: actions/checkout@v7

      - name: Install go-task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Design / Install dependencies
        run: task dev:cli -- corepack pnpm install

      - name: Design / Install Playwright Browsers
        run: task dev:cli -- corepack pnpm exec playwright install --with-deps chromium
        timeout-minutes: 5

      - name: Design / Compile styles
        run: task dev:cli -- corepack pnpm run css:build

      - name: Design / Run accessibility tests
        run: task dev:cli -- corepack pnpm run storybook:axe
