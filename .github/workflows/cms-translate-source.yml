---
# This workflow takes care of sending translations to POEditor or Github Pages.
name: CMS / Translate source
on:
  push:
    branches:
      - develop
    paths:
      - 'cms/**'
      - '.github/workflows/cms-*.yml'

jobs:
  SendToPoeditor:
    name: CMS / Send translatable strings to POEditor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    # Avoid systems crossing each other by not looking for string changes
    # in commits coming from POEditor or from the job itself.
    # Commits from POEditor are in the format: "Update [file] (POEditor.com)"
    # Commits from the this job says: "New translations were found"
    if: ${{ !contains(github.event.head_commit.message, 'POEditor.com') && !contains(github.event.head_commit.message, 'New translations were found') }}
    # A newer run scans a newer tree, so it supersedes one in progress. This
    # is set on the job rather than the workflow: a job skipped by the
    # condition above never joins the group, so the push from this job can't
    # cancel the run that made it.
    concurrency:
      group: cms-translate-source
      cancel-in-progress: true
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
    env:
      LANGUAGE: da
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # We have branch protection on. To get around it, we use a PAT,
          # supplied by the DPL Platform Bot.
          token: ${{ secrets.AUTOCOMMIT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
      - name: Install go-task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup site
        run: task ci:reset
        # The images build the JS assets during `docker compose build`, and
        # compose reads the token from the host environment as a build
        # argument - the runner-level npm config does not reach the container.
        env:
          WEDOBOOKS_NPM_TOKEN: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
      - name: Scan user interface translations
        run: task translations:scan
      - name: Export translatable configuration strings
        run: task translations:conf:export
      - name: Combine danish po files
        run: task translations:conf:merge
        # Neither input file is committed. They are produced by the two steps
        # above and only exist in the workspace, so this step must stay after
        # both of them.
        env:
          FILE_A: web/profiles/dpl_cms/translations/da.po
          FILE_B: web/profiles/dpl_cms/translations/da.config.po
      - name: Commit all combined translations
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: "./cms/web/profiles/dpl_cms/translations/*.combined.po"
          commit_message: New translations were found
          # The action's shallow fetch cuts the history a rebase needs, and
          # its push fails if develop moved while this job ran. Push below.
          skip_fetch: true
          skip_push: true
      - name: Push translations
        if: steps.commit.outputs.changes_detected == 'true'
        # Rebase onto whatever landed on develop while this job ran. The rebase
        # needs a committer identity; this is the commit action's default, so
        # both commits carry the same one. Autostash covers files the setup
        # steps left modified, which are never pushed.
        # Develop can still move between pull and push, so retry a rejected
        # push. A rebase conflict fails the step straight away.
        run: |
          for attempt in 1 2 3; do
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              pull --rebase --autostash origin develop
            if git push origin HEAD:develop; then
              exit 0
            fi
            echo "Push rejected, retrying ($attempt/3)"
            sleep 10
          done
          exit 1
      - name: Make Poeditor look for changes in translation strings
        uses: distributhor/workflow-webhook@v3
        with:
          webhook_url: ${{ secrets.POEDITOR_WEBHOOK_URL }}

  # Publish translations to GitHub Pages to support consumption by Drupal.
  # The localization system requires translation files to be served with a
  # proper Last-Modified header. This is not possible raw GitHub files.
  PublishToGithubPages:
    name: CMS / Publish translations to Github Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    if: ${{ contains(github.event.head_commit.message, 'POEditor.com') }}
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository which also contain GitHub
      # Pages.
      contents: write
    env:
      LANGUAGE: da
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
      - name: Install go-task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup site
        run: task ci:reset
        # The images build the JS assets during `docker compose build`, and
        # compose reads the token from the host environment as a build
        # argument - the runner-level npm config does not reach the container.
        env:
          WEDOBOOKS_NPM_TOKEN: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
      - name: Separate danish translations into po file
        run: task translations:separate
      - name: Separate danish configuration translations into po file
        run: task translations:separate:config
      - name: Publish translations to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cms/web/profiles/dpl_cms/translations
          destination_dir: cms/translations
          # Don't wipe out other projects folder when deploying this.
          keep_files: true
