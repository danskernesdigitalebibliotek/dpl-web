---
name: Packages / CI

on:
  pull_request:
    paths:
      - "packages/**"
      - "schemas/openapi/fbs-adapter.yaml"
      - ".github/workflows/packages-ci.yml"

# One workflow for everything under packages/, with a group of jobs per package.
# The trigger is deliberately the whole directory: a change to one package also
# re-runs the others' jobs. They are short and the concurrency group cancels
# superseded runs, so this is accepted over a per-package path filter.

concurrency:
  group: ${{ github.repository_id }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # packages/service-layer
  # ---------------------------------------------------------------------------

  TypeCheck:
    name: Service Layer / Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
      - run: pnpm run typecheck
        working-directory: packages/service-layer

  UnitTest:
    name: Service Layer / Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
      - run: pnpm run test
        working-directory: packages/service-layer

  FormatCheck:
    name: Service Layer / Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
      - run: pnpm run format:check
        working-directory: packages/service-layer

  LintCheck:
    name: Service Layer / Lint check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
      - run: pnpm run lint
        working-directory: packages/service-layer

  CodegenCheck:
    name: Service Layer / Codegen up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
      - name: Re-run FBS codegen
        working-directory: packages/service-layer
        run: pnpm run codegen:fbs
      - name: Verify generated files match the spec
        working-directory: packages/service-layer
        run: |
          if ! git diff --exit-code -- fbs/src/generated; then
            echo "::error::Generated FBS files are out of date with fbs-adapter.yaml. Run 'pnpm run codegen:fbs' inside packages/service-layer and commit the result."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # packages/wedobooks
  # ---------------------------------------------------------------------------

  WedobooksBuild:
    name: WeDoBooks / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
      - run: pnpm run typecheck
        working-directory: packages/wedobooks
      - run: pnpm run build
        working-directory: packages/wedobooks

  # ---------------------------------------------------------------------------
  # packages/dependabot-ignore-lint
  # The audit itself runs from dependabot-ignore-lint.yml; this checks the tool.
  # ---------------------------------------------------------------------------

  DependabotIgnoreAuditCheck:
    name: Dependabot Ignore Lint / Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dependabot-ignore-lint
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test
