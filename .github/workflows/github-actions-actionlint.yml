name: GitHub Actions

on:
  pull_request:
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/scripts/**'
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/scripts/**'

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}
      - name: Install go-task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install actionlint problem matcher
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint-matcher.json" \
            https://raw.githubusercontent.com/rhysd/actionlint/main/.github/actionlint-matcher.json
          echo "::add-matcher::$RUNNER_TEMP/actionlint-matcher.json"
      - name: Run actionlint
        run: task ci:actionlint

  shellcheck:
    name: Shellcheck scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install go-task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install GCC problem matcher for Shellcheck
        uses: ammaraskar/gcc-problem-matcher@0.3.0
      - name: Run shellcheck
        run: task ci:shellcheck
