---
name: CMS / Cypress workflow
on:
  workflow_call:
    secrets:
      WEDOBOOKS_NPM_TOKEN:
        description: >-
          Token for WeDoBooks' private npm registry. A called workflow sees no
          secrets its caller does not hand over, so it has to be passed
          explicitly at every call site.
        required: true

jobs:
  Cypress:
    name: CMS / Cypress (${{ matrix.bucket }})
    runs-on: ubuntu-latest
    strategy:
      # One failing machine must not hide the others' results.
      fail-fast: false
      matrix:
        # withMappings/ specs run apart from the rest, on their own site.
        # cypress-split (cms/cypress.config.js) splits the rest over four
        # machines; ~7 min setup each, so a fifth would save under a minute.
        include:
          - bucket: with mappings
            task: ci:cypress:mapped
          - bucket: without mappings 1/4
            task: ci:cypress:split
            split-index: 0
          - bucket: without mappings 2/4
            task: ci:cypress:split
            split-index: 1
          - bucket: without mappings 3/4
            task: ci:cypress:split
            split-index: 2
          - bucket: without mappings 4/4
            task: ci:cypress:split
            split-index: 3

    steps:
      - uses: actions/checkout@v7
        with:
          # Our Taskfile requires a proper checkout to function because of
          # certain vars.
          fetch-depth: 0

      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}

      - name: Install go-task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup site
        run: task ci:reset
        working-directory: cms
        # The images build the JS assets during `docker compose build`, and
        # compose reads the token from the host environment as a build
        # argument - the runner-level npm config does not reach the container.
        env:
          WEDOBOOKS_NPM_TOKEN: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}

      - name: Run Cypress
        run: task ${{ matrix.task }}
        working-directory: cms
        # Read by ci:cypress:split only.
        env:
          SPLIT: 4
          SPLIT_INDEX: ${{ matrix.split-index }}
          # Balance by duration; a spec missing from it counts as the average.
          SPLIT_FILE: cypress/timings.json

      - name: Archive videoes
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: cypress-videos-${{ strategy.job-index }}
          path: cms/cypress/videos

      - name: Archive screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots-${{ strategy.job-index }}
          path: cms/cypress/screenshots
