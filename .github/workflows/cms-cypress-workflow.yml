---
name: CMS / Cypress workflow
on:
  workflow_call:
    inputs:
      # e.g. "unmapped" from "ci:cypress:unmapped"
      id:
        required: true
        type: string
    secrets:
      WEDOBOOKS_NPM_TOKEN:
        description: >-
          Token for WeDoBooks' private npm registry. A called workflow sees no
          secrets its caller does not hand over, so it has to be passed
          explicitly at every call site.
        required: true

jobs:
  Cypress:
    name: CMS / Cypress / ${{ inputs.id }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Our Taskfile requires a proper checkout to function because of
          # certain vars.
          fetch-depth: 0

      - uses: ./.github/actions/common-setup-js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wedobooks-token: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}

      - name: Install go-task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup site
        run: task ci:reset
        working-directory: cms
        # The images build the JS assets during `docker compose build`, and
        # compose reads the token from the host environment as a build
        # argument - the runner-level npm config does not reach the container.
        env:
          WEDOBOOKS_NPM_TOKEN: ${{ secrets.WEDOBOOKS_NPM_TOKEN }}

      - name: Run Cypress
        run: task ci:cypress:${{ inputs.id }}
        working-directory: cms

      - name: Archive videoes
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: cypress-${{ inputs.id }}-videos
          path: cms/cypress/videos

      - name: Archive screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-${{ inputs.id }}-screenshots
          path: cms/cypress/screenshots
