# Unified Dependabot configuration for DPL Web monorepo
# This configuration manages dependency updates for every package in the
# repository:
# - cms (Drupal CMS with Composer and pnpm)
# - design-system (React/Storybook with pnpm)
# - go (Next.js with pnpm)
# - react (React components with pnpm)
# - packages/* (shared TypeScript packages with pnpm)
version: 2
registries:
  # WeDoBooks' own npm registry, which serves the SDK behind the reader and
  # the player, and their mirror of Colibrio underneath it. The token is a
  # Dependabot secret rather than an Actions secret - Dependabot cannot read
  # the latter, which is also why workflow runs on its pull requests need the
  # same secret registered separately.
  #
  # Every npm entry needs it, even though only packages/wedobooks' lockfile
  # contains the SDK. Dependabot runs `pnpm update <dep> -r` across the whole
  # workspace, so bumping a dependency packages/wedobooks also declares (e.g.
  # @types/react, typescript) makes pnpm fetch the SDK's metadata from any
  # entry. This only lets Dependabot reach the registry; it changes nothing in
  # the other packages' dependencies or lockfiles.
  wedobooks:
    type: npm-registry
    url: https://npm.pkg.wedobooks.io
    token: ${{secrets.WEDOBOOKS_NPM_TOKEN}}
updates:
  # GitHub Actions - applies to all workflows in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 20
    schedule:
      interval: weekly
      day: sunday
      time: "20:00"
      timezone: Europe/Copenhagen
    labels:
      - "dependencies"
      - "github_actions"

  # CMS - Composer dependencies
  - package-ecosystem: composer
    directory: "/cms"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 20
    groups:
      drupal-core-minor-releases:
        patterns:
          - "drupal/core"
          - "drupal/core*"
        update-types:
          - "minor"
      drupal-core-patch-releases:
        patterns:
          - "drupal/core"
          - "drupal/core*"
        update-types:
          - "patch"
    ignore:
      # Never attempt automated updates to major Drupal releases.
      - dependency-name: "drupal/core*"
        update-types: ["version-update:semver-major"]
      # Our patch is not compatible with the latest version.
      - dependency-name: "drupal/facets"
        versions: [">3.0.3"]
    schedule:
      interval: weekly
      day: sunday
      time: "20:00"
      timezone: Europe/Copenhagen
    labels:
      - "dependencies"
      - "cms"
      - "drupal"

  # CMS - npm dependencies
  - package-ecosystem: npm
    directory: "/cms"
    registries:
      - wedobooks
    cooldown:
      default-days: 3
    open-pull-requests-limit: 20
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
    ignore:
      # @types/node are linked to the Node version used within the project.
      # Bump the package manually when upgrading to a new Node version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "cypress"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: sunday
      time: "20:00"
      timezone: Europe/Copenhagen
    labels:
      - "dependencies"
      - "cms"
      - "js-dependencies"

  # Design System - npm dependencies
  - package-ecosystem: npm
    directory: "/design-system"
    registries:
      - wedobooks
    cooldown:
      default-days: 3
    open-pull-requests-limit: 20
    versioning-strategy: increase
    schedule:
      interval: weekly
      day: sunday
      time: "20:00"
      timezone: Europe/Copenhagen
    labels:
      - "dependencies"
      - "design-system"
    groups:
      react:
        patterns:
          - "react"
          - "@types/react"
          - "react-dom"
          - "@types/react-dom"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "stylelint-config-recommended-scss"
        versions: [">=16"]
      - dependency-name: "storybook"
        versions: [">=10"]
      # Listed per package because Dependabot cannot exclude one package from a
      # wildcard, and @storybook/addon-designs does not follow Storybook's
      # version line.
      - dependency-name: "@storybook/addon-a11y"
        versions: [">=10"]
      - dependency-name: "@storybook/addon-docs"
        versions: [">=10"]
      - dependency-name: "@storybook/addon-links"
        versions: [">=10"]
      - dependency-name: "@storybook/preset-create-react-app"
        versions: [">=10"]
      - dependency-name: "@storybook/react"
        versions: [">=10"]
      - dependency-name: "@storybook/react-webpack5"
        versions: [">=10"]
      # addon-designs 11 requires Storybook 10; 10.0.2 is its newest release
      # for Storybook 9.
      - dependency-name: "@storybook/addon-designs"
        versions: [">=11"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Go (Next.js) - npm dependencies
  - package-ecosystem: npm
    directory: "/go"
    registries:
      - wedobooks
    cooldown:
      default-days: 3
    open-pull-requests-limit: 20
    versioning-strategy: increase
    schedule:
      interval: weekly
      day: sunday
      time: "20:00"
      timezone: Europe/Copenhagen
    labels:
      - "dependencies"
      - "go"
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"
      graphql-codegen:
        patterns:
          - "@graphql-codegen/*"
      typescript:
        patterns:
          - "typescript"
          - "tsx"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - "next"
          - "@next/env"
          - "eslint-config-next"
          - "@next/eslint-plugin-next"
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwindcss-animate"
      prettier:
        patterns:
          - "prettier"
          - "eslint-config-prettier"
      cva:
        patterns:
          - "class-variance-authority"
          - "clsx"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
          - "eslint-plugin-storybook"
      xstate:
        patterns:
          - "xstate"
          - "@xstate/*"
      react-query:
        patterns:
          - "@tanstack/react-query"
          - "@tanstack/react-query-devtools"
      jwt-simple:
        patterns:
          - "jwt-simple"
          - "@types/jwt-simple"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/js"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react 6 expects a newer Vite major than the current Go frontend uses.
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=6.0.0"]
      # The Go lint stack still depends on packages that only support ESLint 8/9.
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      - dependency-name: "cypress"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # orval v8 requires breaking config/fetcher changes — upgrade tracked separately.
      - dependency-name: "orval"
        update-types: ["version-update:semver-major"]
      # DDFNEXT-1609
      - dependency-name: "jsdom"
        versions: [">=30.1.0"]
      # DDFNEXT-1616
      - dependency-name: "@graphql-codegen/typescript"
        versions: [">=6.0.0"]
      # DDFNEXT-1616
      - dependency-name: "@graphql-codegen/typescript-operations"
        versions: [">=6.0.0"]

  # React - npm dependencies
  - package-ecosystem: npm
    directory: "/react"
    registries:
      - wedobooks
    cooldown:
      default-days: 3
    open-pull-requests-limit: 20
    versioning-strategy: increase
    schedule:
      interval: weekly
      day: sunday
      time: "20:00"
      timezone: Europe/Copenhagen
    labels:
      - "dependencies"
      - "react"
    groups:
      babel:
        patterns:
          - "@babel/*"
      fullcalendar:
        patterns:
          - "@fullcalendar/*"
      graphql-codegen:
        patterns:
          - "@graphql-codegen/*"
          - "@graphql-typed-document-node/core"
          - "replace-in-file"
          - "typescript-graphql-typed-files-modules"
      react:
        patterns:
          - "react"
          - "@types/react"
          - "react-dom"
          - "@types/react-dom"
      react-query:
        patterns:
          - "@tanstack/react-query"
      redux:
        patterns:
          - "@reduxjs/toolkit"
          - "@types/react-redux"
          - "react-redux"
          - "redux"
          - "redux-persist"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      testing-library:
        patterns:
          - "@testing-library/*"
      cypress:
        patterns:
          - "cypress"
          - "@cypress/*"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "storybook"
        versions: [">=9"]
      - dependency-name: "@storybook/react"
        versions: [">=9.0.0"]
      - dependency-name: "@storybook/react-webpack5"
        versions: [">=9"]
      - dependency-name: "@storybook/addon-queryparams"
        versions: [">=9.0.0"]
      - dependency-name: "@chromatic-com/storybook"
        versions: [">=4"]
      - dependency-name: "dotenv"
        update-types: ["version-update:semver-major"]
      # The current React lint stack still depends on plugins that are not ESLint 10 compatible.
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      # eslint-plugin-cypress v6 uses a flat-config shape that the current ESLint setup rejects.
      - dependency-name: "eslint-plugin-cypress"
        versions: [">=6.0.0"]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # orval v8 requires breaking config/fetcher changes — upgrade tracked separately.
      - dependency-name: "orval"
        update-types: ["version-update:semver-major"]
      - dependency-name: "stylelint-config-recommended-scss"
        update-types: ["version-update:semver-major"]
      # codegen breaks with these versions. DDFNEXT-1455
      # typescript-operations v6 emits the enums and inputs it uses itself and
      # collides with the typescript plugin in the same file, so the output has
      # to be split in two files. It also makes nullable fields required
      # (`field: T | null`), which a handful of Cypress factories must follow.
      # graphql 17 is also unsupported by the pinned codegen toolchain (all
      # plugins peer-require graphql ^16), so codegen crashes on it.
      - dependency-name: "graphql"
        versions: [">=17.0.0"]
      - dependency-name: "@graphql-codegen/typescript"
        versions: [">=6.0.0"]
      - dependency-name: "@graphql-codegen/typescript-operations"
        versions: [">=6.0.0"]

  # Shared workspace packages - npm dependencies.
  # `directories` (plural) is the only form that supports globbing, so this
  # one entry covers every current and future package under packages/ without
  # needing a new entry per package. Directories without a manifest are
  # skipped.
  - package-ecosystem: npm
    directories:
      - "/packages/*"
    registries:
      - wedobooks
    cooldown:
      default-days: 3
    open-pull-requests-limit: 20
    versioning-strategy: increase
    schedule:
      interval: weekly
      day: sunday
      time: "20:00"
      timezone: Europe/Copenhagen
    labels:
      - "dependencies"
      - "packages"
    groups:
      typescript-eslint:
        patterns:
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "@eslint/js"
          - "eslint"
      prettier:
        patterns:
          - "prettier"
          - "@trivago/prettier-plugin-sort-imports"
    ignore:
      # @types/node are linked to the Node version used within the project.
      # Bump the package manually when upgrading to a new Node version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # orval v8 requires breaking config/fetcher changes — upgrade tracked
      # separately, and must happen in step with react/ and go/.
      - dependency-name: "orval"
        update-types: ["version-update:semver-major"]
