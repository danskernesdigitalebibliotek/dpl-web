name: Build design system
description: Reusable action to build the design system.
inputs:
  token:
    description: GitHub token for authenticating with the npm registry.
    required: true
  wedobooks-token:
    description: >-
      Token for WeDoBooks' private npm registry. Passed through to
      common-setup-js, which needs it to install the workspace.
    required: false
runs:
  using: composite
  steps:
    - uses: ./.github/actions/common-setup-js
      with:
        token: ${{ inputs.token }}
        wedobooks-token: ${{ inputs.wedobooks-token }}
    - name: Install go-task
      uses: arduino/setup-task@v2
      with:
        repo-token: ${{ inputs.token }}
    - name: Build design system
      shell: bash
      run: task dev:design-system:build
