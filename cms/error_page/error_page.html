<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Bibliotekets hjemmeside er stødt på en uventet fejl</title>
  <!--
    This page is shown when Drupal fails hard, e.g. when the database is
    unavailable. It is rendered by the error_page module without Drupal
    services, so it must be fully self-contained: no external assets.
    Placeholders (uuid, base_path, error_report) are replaced everywhere in
    this file, including comments, so don't write them in full here.
    The error report is left out on purpose: technical details belong in the
    log, which carries the same uuid as the page.
  -->
  <style>
    html {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #222;
      background: #fff;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
    }
    main {
      max-width: 40rem;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      line-height: 1.25;
      margin: 0 0 1.5rem;
    }
    p {
      font-size: 1.25rem;
      line-height: 1.5;
      margin: 0 0 1rem;
    }
    .error-reference {
      margin-top: 2rem;
      font-size: 0.875rem;
      color: #595959;
    }
  </style>
</head>
<body>
<main>
  <h1>Bibliotekets hjemmeside er stødt på en uventet fejl.</h1>
  <p>Vi beklager ventetiden, og vi arbejder på at få hjemmesiden op igen hurtigst muligt.</p>
  <p>Prøv eventuelt i mellemtiden at bruge den nationale bibliotekshjemmeside Bibliotek.dk eller vores apps: Biblo, Mit Biblo eller Biblo GO!</p>
  <p class="error-reference">Fejlkode: {{ uuid }}</p>
</main>
</body>
</html>
