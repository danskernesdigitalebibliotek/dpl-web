# This docker-compose file follows the best-practicis for a docker-compose setup
# used by a Lagoon based project.
# https://docs.lagoon.sh/lagoon/using-lagoon-the-basics/docker-compose-yml
#
# Note that this file is not actually processed by lagoon. Instead a specialized
# version is injected during deployment by the dpl-platform. As a consequence
# any major changes made to his file, will also need to be made to the version
# used during deployment.
#
# Consult https://github.com/danskernesdigitalebibliotek/dpl-platform for
# further details.

# This block is used for inclusion in the environment section of each container.
x-volumes:
  &default-volumes
    # Define all volumes you would like to have real-time mounted into the docker containers
    volumes:
      - '../:/app'
      # /schemas/ read-only for drush sailor:codegen (local-dev only —
      # Lagoon's injected docker-compose doesn't have this mount).
      - '../schemas:/schemas:ro'

x-user:
  &default-user
    # The default user under which the containers should run. Change this if you are on linux and run with another user than id `1000`
    user: ${UID:-1000}

x-environment:
  &default-environment
    # Lagoon ensures that Drush knows the local site URI using this variable.
    LAGOON_ROUTE: https://${COMPOSE_PROJECT_NAME}.${DEV_TLD:-local}
    # Environment variables which mimic what will be set in a Lagoon cluster locally
    LAGOON_PROJECT: 'dplcms'
    LAGOON_ENVIRONMENT: 'local'
    LAGOON_ENVIRONMENT_TYPE: ${LAGOON_ENVIRONMENT_TYPE:-local}
    WEBROOT: cms/web
    # Host of the key-value store holding Prometheus metric counters. Settings
    # fall back to non-persistent in-process storage when this is unset, so
    # environments without the service keep working (metrics are just useless
    # there).
    METRICS_REDIS_HOST: redis-metrics
    # WeDoBooks SDK configuration for the ebook reader / audiobook player.
    # One set for the whole platform, per environment - served to the browser
    # by dpl_biblio, so they are runtime values, not build arguments. On
    # Lagoon they arrive as environment variables; locally from the root .env.
    WEDOBOOKS_APPLICATION_ID: ${WEDOBOOKS_APPLICATION_ID:-}
    WEDOBOOKS_FIREBASE_API_KEY: ${WEDOBOOKS_FIREBASE_API_KEY:-}
    WEDOBOOKS_FIREBASE_PROJECT_ID: ${WEDOBOOKS_FIREBASE_PROJECT_ID:-}
    WEDOBOOKS_FIREBASE_APP_ID: ${WEDOBOOKS_FIREBASE_APP_ID:-}
    WEDOBOOKS_READER_API_KEY: ${WEDOBOOKS_READER_API_KEY:-}
    # Uncomment if you like to have the system behave like in production
    #LAGOON_ENVIRONMENT_TYPE: production

services:
  https:
    image: ghcr.io/reload/https-proxy:proxy
    ports:
      - '80'
      - '443'
    depends_on:
      - varnish
    labels:
      lagoon.type: none
      # OrbStack resolves the site's HTTPS URL straight to this proxy (which
      # terminates TLS and forwards to varnish). No /etc/hosts entry needed.
      dev.orbstack.domains: ${COMPOSE_PROJECT_NAME}.${DEV_TLD:-local}
    volumes:
      - '../:/app'
      - '${HOME}/.local/share/mkcert:/rootCA:ro'
      - '${HOME}/.local/share/dev_certificates:/cert:rw'
    environment:
      NGINX_DOCUMENT_ROOT: /app/cms/web
      NGINX_PROXY_PASS: http://varnish:8080
      VIRTUAL_PROTO: https
      VIRTUAL_HOST: ${COMPOSE_PROJECT_NAME}.${DEV_TLD:-local}
    working_dir: /app

  varnish: # Caching HTTP reverse proxy that serves (mostly) anonymous requests.
    # https://docs.lagoon.sh/lagoon/docker-images/varnish
    build:
      context: ..
      dockerfile: cms/lagoon/varnish.dockerfile
    depends_on:
      - nginx
    labels:
      lagoon.type: varnish
    links:
      - nginx # links varnish to the nginx in this docker-compose project, or it would try to connect to any nginx running in docker
    << : *default-user # uses the defined user from top
    ports:
      # Exposing the port to make it accessible locally without proxies.
      - "8080"
    environment:
      << : *default-environment
      # VARNISH_BYPASS: "true" # Add this to disable caching in varnish.
      # Is used by [nginx-proxy](https://github.com/nginx-proxy/nginx-proxy)
      VIRTUAL_HOST: ${COMPOSE_PROJECT_NAME}-varnish.${DEV_TLD:-local}
      VIRTUAL_PORT: 8080

  cli: # cli container, will be used for executing composer and any local commands (drush, drupal, etc.)
    # https://docs.lagoon.sh/lagoon/docker-images/nginx/nginx-drupal
    build:
      context: ..
      dockerfile: cms/lagoon/cli.dockerfile
      args: &skip-baked-in-builds
        # /app is bind-mounted over the image content in dev/CI, so baked-in
        # vendor and JS assets are never used there. The Taskfile sets
        # SKIP_BAKED_IN_BUILDS=true for every compose command; Lagoon builds
        # never see these args (shyaml does not resolve extends) and fall
        # back to the dockerfile defaults, giving full builds.
        SKIP_COMPOSER_INSTALL: "${SKIP_BAKED_IN_BUILDS:-false}"
        SKIP_JS_ASSETS: "${SKIP_BAKED_IN_BUILDS:-false}"
    << : *default-volumes # loads the defined volumes from the top
    user: root
    environment:
      << : *default-environment # loads the defined environment variables from the top
      # Uncomment to enable xdebug for cli tools
      #XDEBUG_ENABLE: "true"
    labels:
      # Lagoon Labels
      lagoon.type: cli-persistent
      lagoon.persistent.name: nginx # mount the persistent storage of nginx into this container
      lagoon.persistent: /app/cms/web/sites/default/files/ # location where the persistent storage should be mounted

  nginx: # Webserver in front of php-fpm. Serves static assets.
    # https://docs.lagoon.sh/lagoon/docker-images/nginx/nginx-drupal
    build:
      context: ..
      dockerfile: cms/lagoon/nginx.dockerfile
      args: *skip-baked-in-builds
    depends_on:
      - php
    # loads the defined volumes and user from the top
    <<: [*default-volumes, *default-user]
    environment:
      << : *default-environment # loads the defined environment variables from the top
      # Route that should be used locally.
      VIRTUAL_HOST: nginx.${COMPOSE_PROJECT_NAME}.${DEV_TLD:-local}
    labels:
      lagoon.type: nginx-php-persistent
      lagoon.persistent: /app/cms/web/sites/default/files/ # location where the persistent storage should be mounted
      lagoon.persistent.size: 10Gi

  php: # php-fpm server that executes php requests.
    # https://docs.lagoon.sh/lagoon/docker-images/php-fpm
    build:
      context: ..
      dockerfile: cms/lagoon/php.dockerfile
      args: *skip-baked-in-builds
    depends_on:
      redis:
        condition: service_started
      redis-metrics:
        condition: service_started
      mariadb:
        condition: service_healthy
      # loads the defined volumes and user from the top
    <<: [*default-volumes, *default-user]
    environment:
      << : *default-environment # loads the defined environment variables from the top
      XDEBUG_ENABLE: ${XDEBUG_ENABLE:-false}
    labels:
      lagoon.type: nginx-php-persistent
      lagoon.name: nginx # we want this service be part of the nginx pod in Lagoon
      lagoon.persistent: /app/cms/web/sites/default/files/ # location where the persistent storage should be mounted

  mariadb: # Main site database.
    # https://docs.lagoon.sh/lagoon/docker-images/mariadb/mariadb-drupal
    image: ${MARIADB_IMAGE:-uselagoon/mariadb-10.6-drupal:latest}
    labels:
      lagoon.type: mariadb
    # Do a periodic healthcheck. This is mainly used to block the php service
    # from starting up before we have a healthy database.
    healthcheck:
      test: "/usr/share/container-scripts/mysql/readiness-probe.sh"
      interval: 10s
    ports:
      - "3306" # exposes the port 3306 with a random local port, find it with `docker-compose port mariadb 3306`
    << : *default-user # uses the defined user from top
    environment:
      MARIADB_CHARSET: 'utf8mb4'
      MARIADB_COLLATION: 'utf8mb4_danish_ci'
      << : *default-environment

  redis: # In-memory key-value database used as the Drupal Core cache backend.
    # https://docs.lagoon.sh/docker-images/redis/
    image: uselagoon/redis-8:latest
    labels:
      lagoon.type: redis
    << : *default-user # uses the defined user from top
    environment:
      << : *default-environment

  redis-metrics: # Key-value store holding Prometheus metric counters.
    # Deliberately separate from the cache instance above: that one runs an LRU
    # eviction policy and gets flushed wholesale (see dev-scripts/flush-redis-
    # cache.php), either of which would corrupt counters. See the dockerfile for
    # why the memory settings live there rather than here.
    build:
      context: ..
      dockerfile: cms/lagoon/redis-metrics.dockerfile
    labels:
      lagoon.type: redis
    << : *default-user # uses the defined user from top
    environment:
      << : *default-environment
