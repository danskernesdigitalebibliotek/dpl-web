
# These should match the same sections in docker-compose.yml.
x-volumes:
  &default-volumes
    volumes:
      - '../:/app'

x-user:
  &default-user
    user: ${UID:-1000}

x-environment:
  &default-environment
    # This is the only that differs from docker-compose.yml
    LAGOON_ROUTE: &default-url https://bnf-${COMPOSE_PROJECT_NAME}.${DEV_TLD:-local}
    LAGOON_PROJECT: 'bnf'
    LAGOON_ENVIRONMENT: 'local'
    LAGOON_ENVIRONMENT_TYPE: ${LAGOON_ENVIRONMENT_TYPE:-local}
    WEBROOT: cms/web
    #
    MARIADB_HOST: bnfmariadb
    REDIS_HOST: bnfredis
    METRICS_REDIS_HOST: bnfredis-metrics
    VARNISH_BACKEND_HOST: bnfnginx
    NGINX_FASTCGI_PASS: bnfphp

services:
  bnfhttps:
    image: ghcr.io/reload/https-proxy:proxy
    ports:
      - '80'
      - '443'
    depends_on:
      - bnfvarnish
    labels:
      lagoon.type: none
    volumes:
      - '../:/app'
      - '${HOME}/.local/share/mkcert:/rootCA:ro'
      - '${HOME}/.local/share/dev_certificates:/cert:rw'
    environment:
      NGINX_DOCUMENT_ROOT: /app/cms/web
      NGINX_PROXY_PASS: http://bnfvarnish:8080
      VIRTUAL_PROTO: https
      VIRTUAL_HOST: >-
        bnf-${COMPOSE_PROJECT_NAME}.${DEV_TLD:-local}
    working_dir: /app

  bnfvarnish: # Caching HTTP reverse proxy that serves (mostly) anonymous requests.
    # https://docs.lagoon.sh/lagoon/docker-images/varnish
    image: uselagoon/varnish-6-drupal:latest
    depends_on:
      - bnfnginx
    labels:
      dev.orbstack.domains: bnf-${COMPOSE_PROJECT_NAME}.local
    links:
      - bnfnginx # links varnish to the nginx in this docker-compose project, or it would try to connect to any nginx running in docker
    << : *default-user # uses the defined user from top
    ports:
      # Exposing the port to make it accessible locally without proxies.
      - "8080"
    environment:
      << : *default-environment
      # VARNISH_BYPASS: "true" # Add this to disable caching in varnish.
      # Is used by [nginx-proxy](https://github.com/nginx-proxy/nginx-proxy)
      VIRTUAL_HOST: ${COMPOSE_PROJECT_NAME}-bnfvarnish.${DEV_TLD:-local}
      VIRTUAL_PORT: 8080
      SERVICE_NAME: bnfvarnish

  bnfcli: # cli container, will be used for executing composer and any local commands (drush, drupal, etc.)
    # https://docs.lagoon.sh/lagoon/docker-images/nginx/nginx-drupal
    build:
      context: ..
      dockerfile: cms/lagoon/cli.dockerfile
      # Same reasoning as in docker-compose.yml: image content is shadowed
      # by the /app bind mount in dev/CI.
      args: &skip-baked-in-builds
        SKIP_COMPOSER_INSTALL: "${SKIP_BAKED_IN_BUILDS:-false}"
        SKIP_JS_ASSETS: "${SKIP_BAKED_IN_BUILDS:-false}"
        # Read-only token for WeDoBooks' private npm registry, which serves
        # the SDK behind the reader and the player. Comes from the root .env
        # (cms/.env symlinks to it). Used only in the discarded asset stage.
        WEDOBOOKS_NPM_TOKEN: ${WEDOBOOKS_NPM_TOKEN:-}
    << : *default-volumes # loads the defined volumes from the top
    user: root
    environment:
      << : *default-environment # loads the defined environment variables from the top
      # Uncomment to enable xdebug for cli tools
      #XDEBUG_ENABLE: "true"

  bnfnginx: # Webserver in front of php-fpm. Serves static assets.
    # https://docs.lagoon.sh/lagoon/docker-images/nginx/nginx-drupal
    build:
      context: ..
      dockerfile: cms/lagoon/nginx.dockerfile
      args: *skip-baked-in-builds
    depends_on:
      - bnfphp
    # loads the defined volumes and user from the top
    <<: [*default-volumes, *default-user]
    environment:
      << : *default-environment # loads the defined environment variables from the top
      # Route that should be used locally.
      VIRTUAL_HOST: bnfnginx.${COMPOSE_PROJECT_NAME}.${DEV_TLD:-local}

  bnfphp: # php-fpm server that executes php requests.
    # https://docs.lagoon.sh/lagoon/docker-images/php-fpm
    build:
      context: ..
      dockerfile: cms/lagoon/php.dockerfile
      args: *skip-baked-in-builds
    depends_on:
      bnfredis:
        condition: service_started
      bnfredis-metrics:
        condition: service_started
      bnfmariadb:
        condition: service_healthy
      # loads the defined volumes and user from the top
    <<: [*default-volumes, *default-user]
    environment:
      << : *default-environment # loads the defined environment variables from the top
      XDEBUG_ENABLE: ${XDEBUG_ENABLE:-false}

  bnfmariadb: # Main site database.
    # https://docs.lagoon.sh/lagoon/docker-images/mariadb/mariadb-drupal
    image: uselagoon/mariadb-10.6-drupal:latest
    # Do a periodic healthcheck. This is mainly used to block the php service
    # from starting up before we have a healthy database.
    healthcheck:
      test: "/usr/share/container-scripts/mysql/readiness-probe.sh"
      interval: 10s
    ports:
      - "3306" # exposes the port 3306 with a random local port, find it with `docker-compose port mariadb 3306`
    << : *default-user # uses the defined user from top
    environment:
      MARIADB_CHARSET: 'utf8mb4'
      MARIADB_COLLATION: 'utf8mb4_danish_ci'
      << : *default-environment

  bnfredis: # In-memory key-value database used as the Drupal Core cache backend.
    # https://docs.lagoon.sh/docker-images/redis/
    image: uselagoon/redis-8:latest
    labels:
      lagoon.type: redis
    << : *default-user # uses the defined user from top
    environment:
      << : *default-environment

  bnfredis-metrics: # Key-value store holding Prometheus metric counters.
    # See the redis-metrics service in docker-compose.yml for the rationale.
    build:
      context: ..
      dockerfile: cms/lagoon/redis-metrics.dockerfile
    labels:
      lagoon.type: redis
    << : *default-user # uses the defined user from top
    environment:
      << : *default-environment
