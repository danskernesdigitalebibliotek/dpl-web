# This is a go-task file solely for translation handling.
# It can be used independently but is meant to be used
# in combination with the go-task file in the root of the project.
# You can read about the Task files here: https://taskfile.dev.
version: "3"

vars:
  # Directory with translation sources.
  PO_DIR: "profiles/dpl_cms/translations"

tasks:
  scan:
    desc: Scan and generate translations
    cmds:
      # Make sure that the potx module is active
      - task dev:cli -- drush en -y potx
      # Generate translations for modules and themes
      - task dev:cli -- drush dpl_po:scan-source {{ .LANGUAGE }} {{ .PATH_TO_FILE }}
      - task: chown
        vars:
          PATH_TO_FILE: "{{ .PATH_TO_FILE }}"
    requires:
      vars: [LANGUAGE, PO_DIR]
    # A var rather than an env entry, so that it can be passed on to chown. No
    # command in this task needs it in the shell environment.
    vars:
      PATH_TO_FILE: "{{ .PO_DIR }}/{{ .LANGUAGE }}.po"

  conf:export:
    desc: Exports current configuration into po file
    cmds:
      # Generate translations from configuration strings
      - task dev:cli -- drush dpl_po:export-config-po {{ .LANGUAGE }} $PATH_TO_FILE
      - task: chown
        vars:
          PATH_TO_FILE: "{{ .PO_DIR }}/{{ .LANGUAGE }}.config.po"
    requires:
      vars: [LANGUAGE, PO_DIR]
    env:
      PATH_TO_FILE: "{{ .PO_DIR }}/{{ .LANGUAGE }}.config.po"

  conf:merge:
    desc: Merge configuration translations into the combined translation file
    cmds:
      - task dev:cli -- msgcat --sort-output -o web/$PATH_TO_FILE $FILE_A $FILE_B
      - task: chown
        vars:
          PATH_TO_FILE: "{{ .PO_DIR }}/{{ .LANGUAGE }}.combined.po"
    requires:
      vars: [LANGUAGE, PO_DIR, FILE_A, FILE_B]
    env:
      PATH_TO_FILE: "{{ .PO_DIR }}/{{ .LANGUAGE }}.combined.po"

  normalize:
    desc: Rewrite the combined translation file in our canonical serialization
    summary: |
      Rewrite the combined translation file with the same msgcat invocation
      that conf:merge uses to produce it. POEditor commits the file in its own
      serialization (unwrapped lines, its internal term order, its own
      header), so every later conf:merge commit would otherwise rewrite the
      whole file and drown the real changes in formatting noise. Normalizing
      right after a POEditor export keeps the committed file in one format.
    cmds:
      - task dev:cli -- msgcat --sort-output -o web/$PATH_TO_FILE.normalized web/$PATH_TO_FILE
      - task dev:cli -- mv web/$PATH_TO_FILE.normalized web/$PATH_TO_FILE
      - task: chown
        vars:
          PATH_TO_FILE: "{{ .PO_DIR }}/{{ .LANGUAGE }}.combined.po"
    requires:
      vars: [LANGUAGE, PO_DIR]
    env:
      PATH_TO_FILE: "{{ .PO_DIR }}/{{ .LANGUAGE }}.combined.po"

  separate:
    desc: Save translations from combined file into separate file
    cmds:
      - task dev:cli -- drush dpl_po:extract-ui {{ .LANGUAGE }} $SOURCE $PATH_TO_FILE
      - task: chown
        vars:
          PATH_TO_FILE: "{{ .PO_DIR }}/{{ .LANGUAGE }}.po"
    requires:
      vars: [LANGUAGE, PO_DIR]
    env:
      SOURCE: "{{ .PO_DIR }}/{{ .LANGUAGE }}.combined.po"
      PATH_TO_FILE: "{{ .PO_DIR }}/{{ .LANGUAGE }}.po"

  separate:config:
    desc: Save configuration translations from combined file into separate file
    cmds:
      - task dev:cli -- drush dpl_po:extract-config {{ .LANGUAGE }} $SOURCE $PATH_TO_FILE
      - task: chown
        vars:
          PATH_TO_FILE: "{{ .PO_DIR }}/{{ .LANGUAGE }}.config.po"
    requires:
      vars: [LANGUAGE, PO_DIR]
    env:
      SOURCE: "{{ .PO_DIR }}/{{ .LANGUAGE }}.combined.po"
      PATH_TO_FILE: "{{ .PO_DIR }}/{{ .LANGUAGE }}.config.po"

  chown:
    internal: true
    desc: Chown the PO file in the container with the user of the host
    cmds:
      - |
        export ME=$(id -u);
        task dev:cli -- chown $ME:$ME web/{{ .PATH_TO_FILE }}
    requires:
      vars: [PATH_TO_FILE]
