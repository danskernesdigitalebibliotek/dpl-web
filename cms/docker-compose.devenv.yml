# devenv-only override for the CMS stack.
#
# Layered on top of docker-compose.yml (via COMPOSE_FILE in devenv.nix) so the
# tracked compose file — and the normal `task cms dev:*` workflow — stay
# untouched.
#
# What this override does:
#   1. Serves the CMS over plain HTTP on a fixed localhost port by exposing the
#      varnish edge (:8080) directly. http://*.localhost is a browser "secure
#      context", so we get service-workers / crypto.subtle without any TLS —
#      which lets us drop mkcert, the local CA and the /etc/hosts dance.
#   2. Parks the TLS-terminating `https` proxy: its only job was to terminate
#      TLS, and we no longer serve TLS. A compose profile keeps it out of
#      `docker compose up` without deleting it from the base file.
#   3. Pins Drupal's absolute base URL (LAGOON_ROUTE) to the browser-facing
#      host:port, on every service, so generated links resolve in the browser.

# Pin Drupal's absolute base URL to the browser-facing host:port. The base file
# defaults it to `https://dpl-cms.${DEV_TLD:-local}` (right for a real Lagoon
# cluster, wrong here). Set on ALL four services: a CLI/cron run has no request
# host and falls back to LAGOON_ROUTE, so any drift there bakes unreachable URLs
# (e.g. https://dpl-cms.local:37102) into Drupal's caches.
x-lagoon-route: &lagoon-route
  LAGOON_ROUTE: "http://dpl-web.localhost:37102"

services:
  # The base file's `https` proxy only existed to terminate TLS and forward to
  # varnish. With plain HTTP we hit varnish directly, so park the proxy behind
  # a profile — `docker compose up` won't start it (nothing depends on it).
  https:
    profiles: ["disabled"]

  # Expose the varnish edge (plain HTTP, :8080) on a fixed host port. compose
  # merges `ports` by concatenation, so this adds to the base file's random
  # mapping. The browser reaches the CMS at http://dpl-web.localhost:37102.
  varnish:
    ports:
      - "37102:8080"
    environment:
      <<: *lagoon-route
  nginx:
    environment:
      <<: *lagoon-route
  cli:
    environment:
      <<: *lagoon-route
  php:
    environment:
      <<: *lagoon-route
