x-links: &links
  - "wiremock:fbi.dpl-cms.local"
  - "wiremock:fbs.dpl-cms.local"
  - "wiremock:adgangsplatformen.dpl-cms.local"
  - "wiremock:gsearch.dpl-cms.local"
  # For mapp-tracking.cy.ts
  - "wiremock:responder.wt-safetag.com"

# Same as docker-compose.yml: containers writing into the bind-mounted /app
# must run as the host user, or the repo fills up with files you cannot edit.
x-user: &default-user
  user: ${UID:-1000}:${GID:-0}

# The repo root is bind-mounted at /app, so .git is now visible inside the
# containers. The checked-out files are owned by the host/runner user, not the
# container user, so git refuses to use the repo ("dubious ownership"). Tools
# that read git metadata (Cypress, Lighthouse CI) trip over this. Mark the repo
# root as safe via env so we don't have to run git config in each container.
x-git-safe-directory: &git-safe-directory
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "safe.directory"
  GIT_CONFIG_VALUE_0: "/app"

services:
  node-chrome:
    build:
      context: ..
      dockerfile: cms/docker/node-chromium.dockerfile
    links: *links
    volumes:
      - "../:/app"
    depends_on:
      - wiremock
    working_dir: "/app/cms"
    <<: *default-user
    environment:
      <<: *git-safe-directory
      CYPRESS_INSTALL_BINARY: 0

  cypress:
    image: cypress/included:15.14.0
    links: *links
    volumes:
      - "../:/app"
      - "./cypress/tsconfig.json:/app/cms/tsconfig.json"
    working_dir: "/app/cms"
    depends_on:
      - wiremock
    <<: *default-user
    environment:
      <<: *git-safe-directory
      CYPRESS_BASE_URL: "http://varnish:8080"
      # The image bakes the 787MB browser into /root/.cache/Cypress and chmods
      # root's home 0777 so a non-root uid can still use it. Point HOME there:
      # a uid the image does not know (the CI runner's) otherwise gets HOME=/,
      # where Electron cannot write its config - the smoke test then times out
      # - and Cypress looks for the browser somewhere it was never unpacked.
      HOME: /root

  wiremock:
    image: wiremock/wiremock:2.32.0
    # The following options are used:
    # --local-response-templating lets WireMock transfer values from request
    # to mocked response
    # --enable-stub-cors is required to make a browser running React
    # components request resources.
    # --verbose makes it easier to see requests and whether they are matched
    # or not.
    command: "--port=80 --https-port=443 --local-response-templating --enable-stub-cors --verbose --disable-banner"
    volumes:
      - "../:/app"
    # Deliberately root, unlike the others: the mappings are registered with
    # `persistent: true`, which writes them to ./mappings under the image's
    # root-owned /home/wiremock. Nothing here writes into the /app bind mount,
    # so it is not a source of root-owned files on the host.
    ports:
      - 80
      - 443
    environment:
      VIRTUAL_HOST: wiremock.${COMPOSE_PROJECT_NAME}.${DEV_TLD:-local}
      VIRTUAL_PORT: 80

  cli:
    links: *links
    environment:
      CI: true
      LAGOON_ENVIRONMENT_TYPE: ci

  php:
    depends_on:
      - wiremock
    links: *links
    environment:
      CI: true
      LAGOON_ENVIRONMENT_TYPE: ci
