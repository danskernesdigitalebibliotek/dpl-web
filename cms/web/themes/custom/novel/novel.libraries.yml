base:
  css:
    theme:
      assets/dpl-design-system/css/base.css: {}
      css/novel.css: {}
  dependencies:
    - core/drupal

service-message:
  css:
    theme:
      css/service-message.css: {}

nav-grid:
  js:
    assets/dpl-design-system/js/init-nav-grid.js: {}

header:
  js:
    assets/dpl-design-system/js/header-sticky.js: {}
    assets/dpl-design-system/js/header-state.js: {}
    assets/dpl-design-system/js/header-sidebar-nav-js.js: {}

slider:
  js:
    assets/dpl-design-system/js/init-slider.js: {}
  dependencies:
    - novel/swiper

swiper:
  remote: 'https://github.com/nolimits4web/swiper.git'
  license:
    name: MIT
    url: https://github.com/nolimits4web/swiper/blob/master/LICENSE
    gpl-compatible: true
  js:
    assets/dpl-design-system/js/swiper-bundle.min.js: { minified: true }
  css:
    theme:
      assets/dpl-design-system/css/swiper-bundle.min.css: { minified: true }
footer-accordions:
  js:
    assets/dpl-design-system/js/footer-accordions.js: {}

show-more:
  js:
    assets/dpl-design-system/js/show-more.js: {}

flatpickr:
  remote: 'https://github.com/flatpickr/flatpickr.git'
  license:
    name: MIT
    url: https://github.com/flatpickr/flatpickr/blob/master/LICENSE.md
    gpl-compatible: true
  js:
    /libraries/flatpickr/dist/flatpickr.min.js: { minified: true }
    /libraries/flatpickr/dist/l10n/da.js: {}
  css:
    theme:
      /libraries/flatpickr/dist/flatpickr.min.css: { minified: true }

date-range-facet:
  js:
    js/date-range-facet.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings
    - novel/flatpickr

content-list-month-separator:
  js:
    assets/dpl-design-system/js/content-list-month-separator.js: {}
