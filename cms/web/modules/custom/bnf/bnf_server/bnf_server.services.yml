---
services:
  _defaults:
    autowire: true

  cache_context.bnf_library_session:
    class: Drupal\bnf_server\Cache\Context\BnfLibrarySessionCacheContext
    tags:
      - { name: cache.context }

  Drupal\bnf_server\Collector\StreamCollector:
    class: Drupal\bnf_server\Collector\StreamCollector
    autowire: true
    tags:
      - { name: dpl_metrics_collector }
