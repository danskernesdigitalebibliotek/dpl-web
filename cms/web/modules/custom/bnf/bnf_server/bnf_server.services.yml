---
services:
  _defaults:
    autowire: true

  cache_context.bnf_library_session:
    class: Drupal\bnf_server\Cache\Context\BnfLibrarySessionCacheContext
    tags:
      - { name: cache.context }

  # These hook services definitions is only needed by Drupal 10, they
  # can be removed when we upgrade to Drupal 11.
  Drupal\bnf_server\Hook\ViewsHooks: {}
  Drupal\bnf_server\Hook\ThemeHooks: {}
