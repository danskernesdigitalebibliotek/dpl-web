---
services:
  _defaults:
    autowire: true

  Drupal\bnf_client\SubscriptionHelper: ~

  bnf_client.exporter:
    class: Drupal\bnf_client\Services\BnfExporter
    arguments:
      $logger: '@logger.channel.bnf'
  Drupal\bnf_client\Services\BnfExporter: '@bnf_client.exporter'

  Drupal\bnf_client\BnfScheduler:
    class: Drupal\bnf_client\BnfScheduler

  logger.channel.bnf_client:
    parent: logger.channel_base
    arguments:
      - 'bnf_client'

  Drupal\bnf_client\Collector\SubscriptionCollector:
    class: Drupal\bnf_client\Collector\SubscriptionCollector
    autowire: true
    tags:
      - { name: dpl_metrics_collector }

  Drupal\bnf_client\Collector\SyncQueueCollector:
    class: Drupal\bnf_client\Collector\SyncQueueCollector
    autowire: true
    tags:
      - { name: dpl_metrics_collector }

  # Core registers hook classes without autoconfiguration, so they need to be
  # defined here for LoggerAwareInterface to get the logger injected until
  # https://www.drupal.org/project/drupal/issues/3605797 is fixed.
  Drupal\bnf_client\Hook\FormHooks:
    autoconfigure: true
