# Schema for the configuration files of the DPL Biblio module.

dpl_biblio.settings:
  type: config_object
  label: 'DPL Biblio settings'
  mapping:
    base_url:
      type: uri
      label: 'Biblio adapter service url'
    enabled:
      type: boolean
      label: 'Use the Biblio adapter for digital materials'
