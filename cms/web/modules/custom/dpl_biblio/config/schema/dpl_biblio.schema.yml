# Schema for the configuration files of the DPL Biblio module.

dpl_biblio.settings:
  type: config_object
  label: 'DPL Biblio settings'
  mapping:
    base_url:
      type: uri
      label: 'Biblio adapter service url'
    enabled:
      type: boolean
      label: 'Use the Biblio adapter for digital materials'
    enabled_go:
      type: boolean
      label: 'Use the Biblio adapter for digital materials on GO'
    # TEMPORARY - remove once Biblio has taken over the reservation queue.
    # The queue belongs to the library, not to a frontend, so one flag covers
    # it. Only the website reserves through Publizon today.
    publizon_reservations_closed:
      type: boolean
      label: 'Close Publizon reservations while the queue is migrated'
