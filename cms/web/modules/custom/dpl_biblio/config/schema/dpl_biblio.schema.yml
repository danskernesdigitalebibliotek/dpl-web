# Schema for the configuration files of the DPL Biblio module.

dpl_biblio.settings:
  type: config_object
  label: 'DPL Biblio settings'
  mapping:
    base_url:
      type: uri
      label: 'Biblio adapter service url'
    enabled:
      type: boolean
      label: 'Use the Biblio adapter for digital materials'
    # TEMPORARY - remove when the catalogue and the adapter agree on which
    # materials exist. See the matching flag in the React apps.
    tolerate_unknown_materials:
      type: boolean
      label: 'Render materials the adapter does not know as unavailable instead of failing'
    # TEMPORARY - remove once Biblio has taken over the reservation queue.
    # Named after the frontend it closes: the website (the React apps) and GO
    # freeze in different periods, so each gets its own flag.
    publizon_reservations_closed_react:
      type: boolean
      label: 'Close Publizon reservations in the React apps'
