---
services:
  dpl_po.commands:
    class: \Drupal\dpl_po\Commands\DplPoCommands
    arguments:
      - '@config.factory'
      - '@dpl_po.config_manager'
      - '@file_system'
      - '@module_handler'
      - '@http_client'
      - '@entity_field.manager'
      - '@cache.config'
    tags:
      - { name: drush.command }
  dpl_po.scan_source_commands:
    class: \Drupal\dpl_po\Commands\ScanSourceCommands
    arguments:
      - '%app.root%'
      - '@language_manager'
      - '@module_handler'
      - '@dpl_po.po_file_builder'
    tags:
      - { name: drush.command }
