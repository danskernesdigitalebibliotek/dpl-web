services:
  logger.channel.dpl_po:
    parent: logger.channel_base
    arguments: ['dpl_po']
  dpl_po.po_file_builder:
    class: Drupal\dpl_po\PoFileBuilder
    arguments:
      - '@logger.channel.dpl_po'
  dpl_po.config_manager:
    class: Drupal\dpl_po\Services\CtpConfigManager
    arguments:
      - '@config.storage'
      - '@locale.storage'
      - '@config.factory'
      - '@config.typed'
      - '@language_manager'
      - '@locale.default.config.storage'
      - '@config.manager'
