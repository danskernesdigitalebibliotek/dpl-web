---
services:
  _defaults:
    autowire: true

  dpl_update.media_cleanup:
    class: Drupal\dpl_update\Services\MediaCleanup

  dpl_update.config_ignore:
    class: Drupal\dpl_update\Services\ConfigIgnore
    tags:
      # Runs the collected config_ignore_auto clean-up at end of request.
      - { name: needs_destruction }

  logger.channel.dpl_update:
    parent: logger.channel_base
    arguments:
      - 'dpl_update'

  Drupal\dpl_update\EventSubscriber\ConfigSubscriber:
    tags:
      - { name: 'event_subscriber' }
