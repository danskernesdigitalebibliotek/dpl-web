media_twentythree.settings:
  type: config_object
  label: 'TwentyThree settings'
  mapping:
    allowed_hosts:
      type: sequence
      label: 'Host names TwentyThree videos may be added from'
      sequence:
        type: string
        label: 'Host name'
        constraints:
          UriHost:
            message: 'This is not a valid host name.'
