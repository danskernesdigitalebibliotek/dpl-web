dpl_event.settings:
  type: config_object
  label: 'DPL Event settings'
  mapping:
    price_currency:
      type: string
      label: 'Price currency'
    enable_screen_name:
      type: boolean
      label: 'Enable screen names'
    unpublish_enable:
      type: boolean
      label: 'Unpublish event instances when they have occurred'
    unpublish_schedule:
      type: string
      label: 'Time to pass before an occurred event instance is unpublished'
    unpublish_series_enable:
      type: boolean
      label: 'Unpublish the series when all instances have occurred'
    list_paging_mode:
      type: string
      label: 'Event list paging mode'

facet.widget.config.dpl_event_date_range:
  type: facet.widget.default_config
  label: 'Event date range widget configuration'
  mapping:
    min_label:
      type: label
      label: 'Minimum date label'
    max_label:
      type: label
      label: 'Maximum date label'
    end_field:
      type: string
      label: 'End date field'

plugin.plugin_configuration.facets_processor.dpl_event_date_range:
  type: mapping
  label: 'Event date range'
  mapping:
    max_inclusive:
      type: boolean
      label: 'Max inclusive'
