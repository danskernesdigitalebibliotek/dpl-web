# This is a go-task file for various developer tasks
# e.g. building docker images or setting up local development.
# You can read about the Task files here: https://taskfile.dev.
version: "3"

dotenv: [".task.env"]

# NOTE Go's release images are built in CI, not from here:
# .github/workflows/go-build-base-image.yml builds lagoon/stage1.dockerfile and
# pushes it to ghcr.io/danskernesdigitalebibliotek/dpl-web-go. Lagoon then
# builds lagoon/stage2.dockerfile on top of that tag.

tasks:
  dev:nvm:use:
    summary: Use project Node.js version with nvm
    silent: true
    cmds:
      - bash -lc 'source "${NVM_DIR:-$HOME/.nvm}/nvm.sh" && nvm install && nvm use'

  dev:reset:
    desc: Install development environment and clean up
    cmds:
      # go/.env is a symlink to the central root .env. Bootstrap + ensure it.
      - "[ -f ../.env ] || cp ../.env.example ../.env"
      - "[ -e .env ] || ln -s ../.env .env"
      - task dev:nvm:use
      - pnpm install
      - pnpm run dev:https

  codegen:rest-services:
    desc: Regenerate REST service clients via orval.
    cmds:
      - task dev:nvm:use
      - pnpm run codegen:all-rest-services

  codegen:graphql:
    desc: Regenerate dpl-cms + FBI GraphQL clients from the committed SDL in /schemas/graphql/.
    cmds:
      - task dev:nvm:use
      - pnpm run codegen:graphql

  codegen:publizon:
    desc: Regenerate Publizon REST client.
    cmds:
      - task dev:nvm:use
      - pnpm run codegen:publizon

  codegen:pubhub:
    desc: Regenerate Pubhub SOAP client from WSDL.
    cmds:
      - task dev:nvm:use
      - pnpm run codegen:pubhub

  codegen:unilogin:
    desc: Regenerate Unilogin SOAP client from WSDL.
    cmds:
      - task dev:nvm:use
      - pnpm run codegen:unilogin

  lagoon:stage1:build:
    desc: Build the Go base image (lagoon/stage1.dockerfile) locally.
    summary: |
      CI is what publishes this image; this task is for trying the build
      itself - most usefully the pnpm install, which needs a credential for
      WeDoBooks' private registry and gets it as a BuildKit secret rather
      than a build argument, because this stage is the one that ships.

      The token comes from the central .env (task dev:dotenv:generate). Check
      afterwards that it did not follow the image:

        docker history --no-trunc dpl-web-go:local | grep -i wedobooks
        docker run --rm dpl-web-go:local sh -c 'cat "$HOME/.npmrc"'
    dotenv: ["../.env"]
    cmds:
      # env= reads the value from the environment rather than a file, so the
      # token never lands on disk on the way in either.
      - docker build
        --file lagoon/stage1.dockerfile
        --secret id=WEDOBOOKS_NPM_TOKEN,env=WEDOBOOKS_NPM_TOKEN
        --tag dpl-web-go:local
        ..
    preconditions:
      - sh: '[ -n "$WEDOBOOKS_NPM_TOKEN" ]'
        msg: "WEDOBOOKS_NPM_TOKEN is missing from the central .env - run 'task dev:dotenv:generate'. See packages/wedobooks/README.md."
