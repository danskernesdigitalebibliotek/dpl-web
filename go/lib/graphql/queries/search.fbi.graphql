query searchWithPagination(
  $q: SearchQueryInput!
  $offset: Int!
  $limit: PaginationLimitScalar!
  $filters: SearchFiltersInput
) {
  search(q: $q, filters: $filters) {
    hitcount
    works(offset: $offset, limit: $limit) {
      ...WorkTeaserSearchPage
    }
  }
}

query searchFacets(
  $q: SearchQueryInput!
  $facets: [FacetFieldEnum!]!
  $facetLimit: Int!
  $filters: SearchFiltersInput
) {
  search(q: $q, filters: $filters) {
    facets(facets: $facets) {
      ...SearchFacet
    }
  }
}

query complexSearchForWorkTeaser(
  $cql: String!
  $offset: Int!
  $limit: PaginationLimitScalar!
  $filters: ComplexSearchFiltersInput!
) {
  complexSearch(cql: $cql, filters: $filters) {
    hitcount
    works(offset: $offset, limit: $limit) {
      ...WorkTeaserSearchPage
    }
  }
}

# Exact record lookup for pairing FBS record ids (FAUST) with works — the
# complex search index does not resolve term.faust reliably.
query getManifestationsByFaust($faust: [String!]!) {
  manifestations(faust: $faust) {
    pid
    audience {
      childrenOrAdults {
        code
      }
    }
    ownerWork {
      ...WorkTeaserSearchPage
    }
  }
}
