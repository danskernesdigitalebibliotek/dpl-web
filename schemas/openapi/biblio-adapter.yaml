components:
  schemas:
    GetMetadataApiResponse:
      type: object
      properties:
        materials:
          type: array
          description: Metadata records for the requested ids. Unknown ids are omitted.
          items:
            $ref: '#/components/schemas/MaterialInformationDto'
      required:
      - materials
      additionalProperties: false
    ImportMaterialType:
      anyOf:
      - $ref: '#/components/schemas/MaterialType.Ebook'
      - $ref: '#/components/schemas/MaterialType.Audiobook'
    MaterialInformationDto:
      $ref: '#/components/schemas/Pick_MaterialInformation.author-or-category-or-description-or-collection_title-or-collection_volume_number-or-duration_seconds-or-editor-or-file_bytes-or-isbn-or-languages-or-material_type-or-narrator-or-publish_date-or-publisher-or-thema_codes-or-title-or-translator_'
    MaterialType.Audiobook:
      type: string
      enum:
      - audiobook
    MaterialType.Ebook:
      type: string
      enum:
      - ebook
    ? Pick_MaterialInformation.author-or-category-or-description-or-collection_title-or-collection_volume_number-or-duration_seconds-or-editor-or-file_bytes-or-isbn-or-languages-or-material_type-or-narrator-or-publish_date-or-publisher-or-thema_codes-or-title-or-translator_
    : type: object
      description: From T, pick a set of properties whose keys are in the union K
      properties:
        author:
          type: array
          items:
            type: string
        material_type:
          $ref: '#/components/schemas/ImportMaterialType'
        publish_date:
          type: string
        publisher:
          type: string
        title:
          type: string
        category:
          type: array
          items:
            type: string
        description:
          type: string
        collection_title:
          type: string
        collection_volume_number:
          type: string
        duration_seconds:
          type: integer
          format: int32
        editor:
          type: array
          items:
            type: string
        file_bytes:
          type: integer
          format: int32
        isbn:
          type: string
        languages:
          type: array
          items:
            type: string
        narrator:
          type: array
          items:
            type: string
        thema_codes:
          type: array
          items:
            type: string
        translator:
          type: array
          items:
            type: string
      required:
      - material_type
      - publish_date
      - publisher
      - title
      - category
      - description
      - isbn
      - languages
      - thema_codes
    ApiErrorResponse:
      properties:
        message:
          type: string
      required:
      - message
      type: object
      additionalProperties: false
    CanLoanApiResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CanLoanResponseType'
          description: Current loan decision returned by the loan manager.
        loan_provider:
          $ref: '#/components/schemas/LoanProvider'
          description: Loan provider selected for the attempted loan, when available.
        active_loan_provider:
          type: boolean
          description: Indicates whether the selected provider is currently active for the user/org context.
        message:
          type: string
          description: Human-readable explanation of the loan decision.
        org_id:
          type: string
          description: Organization that governed the decision, when relevant.
        quota_reject:
          $ref: '#/components/schemas/QuotaReject'
          description: Structured quota rejection details when quota rules block the loan.
        unavailable_reason:
          $ref: '#/components/schemas/UnavailableReason'
          description: 'Reason the loan provider returned {@link CanLoanResponseType.Unavailable}

            for the material. Only set when `status` is `unavailable`.'
        lending_block_reason:
          $ref: '#/components/schemas/LendingBlockReason'
          description: 'Why lending is blocked for the session/account. Only set when `status` is

            {@link CanLoanResponseType.LendingBlocked}.'
      required:
      - status
      additionalProperties: false
    CanLoanRejectReasons:
      anyOf:
      - $ref: '#/components/schemas/CanLoanResponseType.ConcurrentLimitExceeded'
      - $ref: '#/components/schemas/CanLoanResponseType.PeriodLimitExceeded'
    CanLoanResponseType:
      enum:
      - unavailable
      - monthly_limit_exceeded
      - concurrent_limit_exceeded
      - wishable
      - reservable
      - loanable
      - no_valid_credentials
      - lending_blocked
      type: string
    CanLoanResponseType.ConcurrentLimitExceeded:
      enum:
      - concurrent_limit_exceeded
      type: string
    CanLoanResponseType.PeriodLimitExceeded:
      enum:
      - monthly_limit_exceeded
      type: string
    UnavailableReason:
      description: 'Reason a loan provider returned {@link CanLoanResponseType.Unavailable} for

        a material. Per-material concurrent quotas are signalled separately via

        {@link CanLoanResponse.quotaReject}.'
      enum:
      - insufficient_funds
      - catalog_excluded
      type: string
    LendingBlockReason:
      description: 'Why a session or account is blocked from lending entirely, independent of any material.
        Surfaced as

        {@link CanLoanResponse.lendingBlockReason} (with canLoan {@link CanLoanResponseType.LendingBlocked})

        on every loan endpoint — both can-loan and the loan-mutating callables return it rather than

        throwing. The string values are the client-facing contract, so they must stay stable.'
      enum:
      - library_card_lending_disabled
      - reauthentication_required
      - email_verification_required
      - quarantined
      - new_account
      type: string
    CreateLoanApiResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CanLoanResponseType'
          description: Current loan decision returned by the loan manager.
        loan_provider:
          $ref: '#/components/schemas/LoanProvider'
          description: Loan provider selected for the attempted loan, when available.
        active_loan_provider:
          type: boolean
          description: Indicates whether the selected provider is currently active for the user/org context.
        message:
          type: string
          description: Human-readable explanation of the loan decision.
        org_id:
          type: string
          description: Organization that governed the decision, when relevant.
        quota_reject:
          $ref: '#/components/schemas/QuotaReject'
          description: Structured quota rejection details when quota rules block the loan.
        unavailable_reason:
          $ref: '#/components/schemas/UnavailableReason'
          description: 'Reason the loan provider returned {@link CanLoanResponseType.Unavailable}

            for the material. Only set when `status` is `unavailable`.'
        lending_block_reason:
          $ref: '#/components/schemas/LendingBlockReason'
          description: 'Why lending is blocked for the session/account. Only set when `status` is

            {@link CanLoanResponseType.LendingBlocked}.'
        loan:
          $ref: '#/components/schemas/LoanDto'
          description: Present only when a loan was actually created.
      required:
      - status
      additionalProperties: false
    GetLoanApiResponse:
      type: object
      properties:
        loan:
          $ref: '#/components/schemas/LoanDto'
          description: Loan details for the requested id.
      additionalProperties: false
    GetLoansApiResponse:
      type: object
      properties:
        loans:
          type: array
          description: Loans for the current page.
          items:
            $ref: '#/components/schemas/LoanDto'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - loans
      - pagination
      additionalProperties: false
    LoanDto:
      properties:
        active:
          type: boolean
        author:
          type: string
        duration:
          type: integer
          format: int32
        id:
          type: string
        is_listen_and_read:
          type: boolean
        license:
          $ref: '#/components/schemas/LoanLicenseInfo'
        lix:
          type: integer
          format: int32
          minimum: 0
        loan_request_type:
