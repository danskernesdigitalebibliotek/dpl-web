# Biblio API Adapter (DBC) — REST contract.
# Source: https://biblio-adapter.dbc.dk/docs — use the "Download OpenAPI
# specification" button and convert the JSON to YAML (see schemas/README.md).
# Consumed by react/ (src/core/biblio, generated via orval).
# Last re-synced against live: 2026-08-13.
openapi: 3.0.3
info:
  title: Biblio API Adapter
  version: 1.0.0
  description: "API contract for the Biblio API adapter service.\n\n## Adapter principles\n\nThis adapter\
    \ exposes two controlled subsets of the `Biblio API`: a browser-safe subset for end-user clients and\
    \ a restricted subset for authorized server-to-server clients. Some endpoints are available in both\
    \ subsets.\n\n- **Bearer-only client auth**: clients send one opaque `bearerAuth` token to the adapter.\n\
    \  `Biblio API` credentials (`x-api-key` and `Biblio API` bearer token) are handled internally in\
    \ the adapter.\n- **User context derivation**: client-supplied `user_id` is not accepted on user-scoped\n\
    \  operations. See **Authentication and user identity** below.\n- **Automatic user provisioning**:\
    \ the adapter ensures that authenticated users exist\n  in `Biblio API` by internally calling `POST\
    \ /v1/auth/create-sign-in-token` with\n  `create_if_not_exists: true`. The created user is associated\
    \ with the resolved\n  `user_id` and `organization_third_party_id` (see **Authentication and user\
    \ identity**).\n- **Response transparency**: responses include `x-response-source` (`adapter` or `wedobooks`)\n\
    \  and `x-request-id` for correlation and debugging.\n\n## Authentication and user identity\n\n**Token**\n\
    \nObtain an OAuth2 access token from [login.bib.dk](https://login.bib.dk) and send it as `Authorization:\
    \ Bearer <token>`.\n\n**Endpoint access**\n\nEndpoints that read or change a user's loans, reservations,\
    \ or user data require a token representing the end user, issued via the OAuth2 `authorization_code`\
    \ grant.\n\nMetadata endpoints can be accessed with either an end-user token or a server-to-server\
    \ token.\n\nServer-to-server access requires a token issued via the OAuth2 `client_credentials` grant.\
    \ The OAuth client must be configured with access to the endpoint.\n\n**Identity resolution**\n\n\
    User-scoped endpoints do not accept client-supplied `user_id` or organization ids. Resolve them from\
    \ login.bib.dk userinfo `attributes` as follows:\n\n1. If both `uniqueId` and `municipalityAgencyId`\
    \ are present:\n   - `user_id` = `uniqueId`\n   - `organization_third_party_id` = `municipalityAgencyId`\n\
    2. Otherwise, use the Unilogin fallback:\n   - `user_id` = `uniloginUniIdHash`\n   - `organization_third_party_id`\
    \ = `uniloginAgencyId`\n\n\nUnilogin fallback requires an active Unilogin license; otherwise the adapter\
    \ returns 403 with `User is missing license`.\n\nIf identity cannot be resolved, the adapter returns\
    \ 403 Forbidden.\n## Unsupported endpoints in adapter\n\nThese endpoints are available in the `Biblio\
    \ API`, but not in this adapter.\n\n- `POST /v1/auth/sign-in` (used internally)\n- `POST /v1/auth/create-user`\n\
    - `Webhooks` (Biblio API outbound webhook events)\n- `GET /v1/inventory`\n- `GET /v1/shelves`\n- `GET\
    \ /v1/onix/{material_id}`\n- `GET /v1/onix/pull/alpha`\n- `GET /v1/onix/pull/delta/{from_utc_timestamp}`\n"
servers:
- url: http://localhost:3000
  description: Local development
paths:
  /v1/auth/create-sign-in-token:
    post:
      operationId: createSignInTokenForAuthenticatedUser
      summary: Create
      description: 'Creates a custom sign-in token for the authenticated user.

        The returned `token` is not itself the bearer token for the `Biblio API`. A client must exchange
        it with authentication and then use the resulting ID token as bearer auth.


        > **Adapter specifics**

        >

        > - Requires a valid bearer token with end-user access.

        > - The adapter derives `user_id`, `create_if_not_exists`, and `user_data` from >   login.bib.dk
        userinfo (see **Authentication and user identity**), so callers must >   not send a request body.

        '
      tags:
      - sign-in-token
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TraceparentHeader'
      responses:
        '200':
          description: Sign-in token created
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSignInTokenApiResponse'
        '401':
          description: Missing, invalid, or expired bearer token
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '403':
          description: User not authorized or credentials unavailable
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '500':
          description: Biblio API or internal server error
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
  /v1/loans:
    get:
      operationId: getLoansForAuthenticatedUser
      summary: Get loans
      description: 'Returns a paginated list of loans.

        By default only active loans are returned because `active` defaults to `true`. Set

        `active=false` to retrieve ended or inactive loans instead.

        Pagination uses the returned loan id as the next `cursor`.


        > **Adapter specifics**

        >

        > - Requires a valid bearer token with end-user access.

        > - The adapter forwards the derived `user_id` (see **Authentication and user identity**).

        '
      tags:
      - loans
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TraceparentHeader'
      - name: limit
        in: query
        required: false
        description: Maximum number of items to return in a single page.
        schema:
          type: integer
          format: int32
          default: 25
          minimum: 1
          maximum: 1000
      - name: cursor
        in: query
        required: false
        description: 'Pagination cursor for fetching the next page. Pass the `cursor` value returned in
          the previous response''s `pagination` object; omit it to fetch the first page. The final page
          returns no cursor.

          '
        schema:
          type: string
      - name: active
        in: query
        required: false
        description: Defaults to `true`. Set to `false` to retrieve inactive or ended loans.
        schema:
          type: boolean
      responses:
        '200':
          description: Paginated loans for the authenticated user
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLoansApiResponse'
        '401':
          description: Invalid or expired bearer token
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '403':
          description: User not authorized or credentials unavailable
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '422':
          description: Validation failed in Biblio API
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '500':
          description: Biblio API or internal server error
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
    post:
      operationId: requestLoanForAuthenticatedUser
      summary: Request loan for user
      description: 'Attempts to create a loan for a user and material immediately.

        This endpoint performs the same availability and quota checks as `GET /v1/loans/can-loan`.

        When a loan is created, the response status is `201` and the `loan` object is populated.

        When the material cannot be loaned, the response is still a successful API response with a decision

        status and optional rejection details, but without a `loan`.


        > **Adapter specifics**

        >

        > - Requires a valid bearer token with end-user access.

        > - The adapter forwards the derived `user_id` (see **Authentication and user identity**).

        '
      tags:
      - loans
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TraceparentHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                material_id:
                  type: string
                  description: ISBN-13 of the material the user wants to loan.
              required:
              - material_id
              additionalProperties: false
      responses:
        '201':
          description: Loan request processed
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/CreateLoanApiResponse'
                - $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Invalid or expired bearer token
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '403':
          description: User not authorized or credentials unavailable
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '422':
          description: Validation failed in Biblio API
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '500':
          description: Biblio API or internal server error
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
  /v1/loans/{loan_id}:
    get:
      operationId: getLoanForAuthenticatedUser
      summary: Get loan
      description: 'Returns a single loan by `loan_id`.

        Use this endpoint to refresh the authoritative state of a known loan after creation,

        or when synchronizing client state with Biblio API loan status.


        > **Adapter specifics**

        >

        > - Requires a valid bearer token with end-user access.

        > - The adapter verifies that returned `loan.uid` matches the derived `user_id`.

        > - If the loan belongs to another user, the adapter returns `404` so the resource appears non-existent.

        '
      tags:
      - loans
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TraceparentHeader'
      - name: loan_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Loan response from Biblio API
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GetLoanApiResponse'
                - $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Invalid or expired bearer token
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '403':
          description: User not authorized or credentials unavailable
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '404':
          description: Loan not found or not accessible to the authenticated user
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '422':
          description: Validation failed in Biblio API
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '500':
          description: Biblio API or internal server error
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
  /v1/loans/can-loan:
    get:
      operationId: canLoanForAuthenticatedUser
      summary: Material loan availability for user
      description: 'Checks whether a user can currently loan a specific material without creating a loan.

        Use this as a preflight check when you want to show availability, provider choice, or quota

        rejection details before calling `POST /v1/loans`.

        The result reflects the state at request time only and should not be treated as a reservation

        or guarantee that a later loan request will still succeed.


        > **Adapter specifics**

        >

        > - Requires a valid bearer token with end-user access.

        > - The adapter forwards the derived `user_id` (see **Authentication and user identity**).

        '
      tags:
      - loans
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TraceparentHeader'
      - name: material_id
        in: query
        required: true
        description: ISBN-13 of the material the user wants to loan.
        schema:
          type: string
      responses:
        '200':
          description: Loan availability response from Biblio API
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/CanLoanApiResponse'
                - $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Invalid or expired bearer token
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '403':
          description: User not authorized or credentials unavailable
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '422':
          description: Validation failed in Biblio API
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '500':
          description: Biblio API or internal server error
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
  /v1/users/get_loan_quotas:
    get:
      operationId: getLoanQuotasForAuthenticatedUser
      summary: Get user loan quotas
      description: 'Returns borrowing quota information for a user across every organization the user
        belongs to.

        Use this endpoint when you need to show remaining loan capacity or organization-specific quota

        rules before attempting a loan.


        The response may contain multiple entries for the same user, one per organization. Each entry

        contains the organization id and name, ancestor ids, whether quotas are split by format or

        shared across formats, and only the relevant quota fields for that mode.


        Treat this as informational state at request time. Loan creation endpoints remain authoritative

        because availability and quota usage can change between calls.


        When `split_on_format` is `true`, the response includes per-format loan limits and usage for

        audiobooks and ebooks. When `split_on_format` is `false`, the response includes combined loan

        limits and usage across formats.


        > **Adapter specifics**

        >

        > - Requires a valid bearer token with end-user access.

        > - The adapter forwards the derived `user_id` (see **Authentication and user identity**).

        '
      tags:
      - users
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TraceparentHeader'
      responses:
        '200':
          description: Loan quotas response from Biblio API
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GetLoanQuotasApiResponse'
                - $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Invalid or expired bearer token
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '403':
          description: User not authorized or credentials unavailable
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '404':
          description: User or quotas not found
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '422':
          description: Validation failed in Biblio API
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '500':
          description: Biblio API or internal server error
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
  /v1/users/get_support_id:
    get:
      operationId: getSupportIdForAuthenticatedUser
      summary: Get user support id
      description: 'Returns the support id for a user.

        If the user does not already have a support id, one is generated and persisted before the

        response is returned.


        > **Adapter specifics**

        >

        > - Requires a valid bearer token with end-user access.

        > - The adapter forwards the derived `user_id` (see **Authentication and user identity**).

        '
      tags:
      - users
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TraceparentHeader'
      responses:
        '200':
          description: Support id response from Biblio API
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GetSupportIdApiResponse'
                - $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Invalid or expired bearer token
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '403':
          description: User not authorized or credentials unavailable
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '404':
          description: User or support id not found
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '422':
          description: Validation failed in Biblio API
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '500':
          description: Biblio API or internal server error
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
  /v1/reservations:
    get:
      operationId: getReservationsForAuthenticatedUser
      summary: Get reservations.
      description: 'Returns a paginated list of reservations.

        When `limit` is omitted, the default page size is `25`.

        The returned pagination cursor is the reservation id to send back on the next request.


        > **Adapter specifics**

        >

        > - Requires a valid bearer token with end-user access.

        > - The adapter forwards the derived `user_id` (see **Authentication and user identity**).

        > - The adapter does not support listing reservations across users.

        '
      tags:
      - reservations
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TraceparentHeader'
      - name: limit
        in: query
        required: false
        description: Maximum number of items to return in a single page.
        schema:
          type: integer
          format: int32
          default: 25
          minimum: 1
          maximum: 1000
      - name: cursor
        in: query
        required: false
        description: 'Pagination cursor for fetching the next page. Pass the `cursor` value returned in
          the previous response''s `pagination` object; omit it to fetch the first page. The final page
          returns no cursor.

          '
        schema:
          type: string
      responses:
        '200':
          description: Paginated reservations for the authenticated user
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReservationsApiResponse'
        '401':
          description: Invalid or expired bearer token
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '403':
          description: User not authorized or credentials unavailable
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '422':
          description: Validation failed in Biblio API
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '500':
          description: Biblio API or internal server error
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
    post:
      operationId: createReservationForAuthenticatedUser
      summary: Create reservation
      description: 'Requests a reservation for a user and material.


        If the material can be loaned right away, the endpoint creates a loan instead of a waiting

        reservation and responds with status `201`. Otherwise it returns status `200` with a

        reservation-oriented decision payload.


        > **Adapter specifics**

        >

        > - Requires a valid bearer token with end-user access.

        > - The adapter forwards the derived `user_id` (see **Authentication and user identity**).

        '
      tags:
      - reservations
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TraceparentHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                material_id:
                  type: string
                  description: ISBN-13 of the requested material.
              required:
              - material_id
              additionalProperties: false
      responses:
        '200':
          description: Reservation request processed
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReservationApiResponse'
        '201':
          description: Reservation request fulfilled immediately as loan
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReservationApiResponse'
        '401':
          description: Invalid or expired bearer token
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '403':
          description: User not authorized or credentials unavailable
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '422':
          description: Validation failed in Biblio API
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
        '500':
          description: Biblio API or internal server error
          headers:
            x-response-source:
              $ref: '#/components/headers/ResponseSourceHeader'
            x-request-id:
              $ref: '#/components/headers/RequestIdHeader'
  /v1/reservations/accept-offer:
    post:
      operationId: acceptReservationOfferForAuthenticatedUser
      summary: Accept reservation offer
      description: 'Accepts an active reservation offer and converts it into a loan.

        Either `offer_id` or `reservation_id` can be used.


        A reservation offer temporarily holds the relevant license for the title and price model.

        On expiry/cancellation the license will be released.

        On success, the response includes the created `loan_id` and uses status `201`.


        The reservation and the offer are cleaned up shortly after acceptance, so external systems

        should not expect those records to remain available indefinitely.


        > **Adapter specifics**

        >

        > - Requires a valid bearer token with end-user access.

        '
      tags:
      - reservations
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TraceparentHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
