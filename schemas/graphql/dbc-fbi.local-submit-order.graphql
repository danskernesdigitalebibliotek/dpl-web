# Local SDL extension: order submission, as the FBI gateway used to serve it.
#
# THIS IS NOT UPSTREAM SCHEMA. Do not refresh it, and do not merge it into
# dbc-fbi.graphql. It exists so that react/src/apps/material/openOrder.graphql
# keeps compiling.
#
# DBC removed `Mutation.submitOrder` and its input/response types from every
# profile we can introspect. The whole Mutation type upstream is now just
# `elba: ElbaServices!`, whose only field is `placeCopyRequest` (article
# copies, not material orders) — so the replacement is not another profile,
# it is another service. Meanwhile react still ships the mutation:
# `ReservationModalBody.tsx` calls `useOpenOrderMutation()` for interlibrary
# loans, i.e. the reservation flow for materials the local branch does not own.
#
# What this file buys, and what it does not: it keeps react's codegen green.
# It does not make the mutation work. If the field is really gone from the
# gateway, that reservation flow is already failing at runtime, and vendoring
# the types here does not change that either way. Finding out where order
# submission is supposed to live now is the open task — see schemas/README.md.
#
# Delete this file, and the openOrder document with it, once that is answered.
# The definitions below are verbatim from the last introspection that still
# contained them — the since-deleted dbc-fbi.temp-next.graphql snapshot.

extend type Mutation {
  submitOrder(dryRun: Boolean, input: SubmitOrderInput!): SubmitOrder
}

type SubmitOrder {
  deleted: Boolean
  message: String

  """
  if order was submitted successfully
  """
  ok: Boolean
  orderId: String
  orsId: String
  status: SubmitOrderStatusEnum!
}

input SubmitOrderInput {
  author: String
  authorOfComponent: String
  exactEdition: Boolean

  """
  expires is required to be iso 8601 dateTime eg. "2024-03-15T12:24:32Z"
  """
  expires: String
  key: String
  orderType: OrderTypeEnum
  pagination: String
  pickUpBranch: String!
  pids: [String!]!
  publicationDate: String
  publicationDateOfComponent: String
  title: String
  titleOfComponent: String
  userParameters: SubmitOrderUserParametersInput!
  volume: String
}

input SubmitOrderUserParametersInput {
  barcode: String
  cardno: String
  cpr: String
  customId: String
  pincode: String
  userAddress: String
  userDateOfBirth: String
  userId: String
  userMail: String
  userName: String
  userTelephone: String
}

enum OrderTypeEnum {
  ESTIMATE
  HOLD
  LOAN
  NON_RETURNABLE_COPY
  NORMAL
  STACK_RETRIEVAL
}

enum SubmitOrderStatusEnum {
  """
  Authentication error
  """
  AUTHENTICATION_ERROR

  """
  Borchk: User is blocked by agency
  """
  BORCHK_USER_BLOCKED_BY_AGENCY

  """
  Borchk: User could not be verified
  """
  BORCHK_USER_NOT_VERIFIED

  """
  Borchk: User is no longer loaner at the provided pickupbranch
  """
  BORCHK_USER_NO_LONGER_EXIST_ON_AGENCY

  """
  Pincode was not found in arguments
  """
  ERROR_MISSING_PINCODE

  """
  Order does not validate
  """
  INVALID_ORDER

  """
  Item not available at pickupAgency, item localised for ILL
  """
  NOT_OWNED_ILL_LOC

  """
  Item not available at pickupAgency, item not localised for ILL
  """
  NOT_OWNED_NO_ILL_LOC

  """
  Item not available at pickupAgency, ILL of mediumType not accepted
  """
  NOT_OWNED_WRONG_ILL_MEDIUMTYPE

  """
  ServiceRequester is obligatory
  """
  NO_SERVICEREQUESTER

  """
  Error sending order to ORS
  """
  ORS_ERROR

  """
  Item available at pickupAgency, order accepted
  """
  OWNED_ACCEPTED

  """
  Item available at pickupAgency, item may be ordered through the library's catalogue
  """
  OWNED_OWN_CATALOGUE

  """
  Item available at pickupAgency, order of mediumType not accepted
  """
  OWNED_WRONG_MEDIUMTYPE

  """
  Service unavailable
  """
  SERVICE_UNAVAILABLE

  """
  Unknown error occured, status is unknown
  """
  UNKNOWN_ERROR

  """
  PickupAgency not found
  """
  UNKNOWN_PICKUPAGENCY

  """
  User not found
  """
  UNKNOWN_USER
}
