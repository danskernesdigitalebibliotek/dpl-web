version: '3'

dotenv: [".task.env"]

vars:
  COMMIT_COUNT:
    sh: git rev-list --count origin/main

  # Constructing docker image name.
  DOCKER_IMAGE_PREFIX: '{{ .RELEASE_IMAGE_REGISTRY }}/{{ .DOCKER_IMAGE_NAMESPACE }}'

  # Constructing docker image name.
  RELEASE_IMAGE_NAME: '{{.RELEASE_IMAGE_NAME | default "dpl-cms-source"}}'
  RELEASE_FULL_NAME: '{{.RELEASE_IMAGE_REGISTRY}}/{{.RELEASE_IMAGE_NAME}}:{{.RELEASE_IMAGE_TAG}}'

  # Docker file selection
  DOCKER_COMPOSE_FILES_DEFAULT: '-f docker-compose.yml'
  DOCKER_COMPOSE_FILES: '{{.DOCKER_COMPOSE_FILES | default .DOCKER_COMPOSE_FILES_DEFAULT }}'

tasks:
  dev:install:
    summary: Install packages
    cmds:
      - echo "Install packages by running `pnpm install` in the root folder of the repository."

  dev:start:
    summary: Install and run docker compose
    cmds:
      - task dev:install
      - docker compose {{ .DOCKER_COMPOSE_FILES }} up --detach
      - echo "Design System is starting. It can take a while before Storybook is ready."
      - echo "https://${COMPOSE_PROJECT_NAME:-design-system}.local will shotly be available."

  dev:stop:
    summary: Stop docker compose environment
    cmds:
      - docker compose {{ .DOCKER_COMPOSE_FILES }} stop

  dev:up:
    summary: Run docker compose
    cmds:
      - docker compose {{ .DOCKER_COMPOSE_FILES }} up --detach

  dev:down:
    summary: Stop and remove docker compose environment
    cmds:
      # DNS proxies such as Dory may hang on to the network for a bit which
      # causes the process to fail. Wait and retry if that is the case
      - docker compose {{ .DOCKER_COMPOSE_FILES }} down --volumes --remove-orphans || (sleep 3 && docker-compose down)

  dev:logs:
    summary: Tail docker compose logs for web-pack
    cmds:
      - docker compose logs node --follow

  dev:axe:
    summary: Run accessibility tests
    cmds:
      - task dev:cli -- pnpm run storybook:axe

  dev:reset:
    summary: Install development environment and clean up.
    cmds:
      - task dev:down
      - task dev:start

  dev:test:
    summary: Run tests
    cmds:
      - task dev:cli -- pnpm run chromatic

  dev:format:
    summary: Auto-fix linting errors
    cmds:
      - task dev:cli -- pnpm run format

  dev:lint:
    summary: Run linters
    cmds:
      - task dev:cli -- pnpm run lint

  dev:chromatic:
    summary:  Run Chromatic for visual test
    cmds:
      - task dev:cli -- pnpm run chromatic

  dev:argos:
    summary: |
      Upload screenshots of unpushed work to Argos, compared against the CI
      baseline of BASE (default develop). Needs ARGOS_TOKEN in the root .env.
    vars:
      BASE: '{{.BASE | default "develop"}}'
      BRANCH:
        sh: git rev-parse --abbrev-ref HEAD
    env:
      # Only the token: the root .env also sets COMPOSE_PROJECT_NAME.
      ARGOS_TOKEN:
        sh: sed -n 's/^ARGOS_TOKEN=//p' ../.env 2>/dev/null | tr -d '"'
    preconditions:
      - sh: test -n "$ARGOS_TOKEN"
        msg: ARGOS_TOKEN is missing from the root .env. Run `task dev:dotenv:generate` in the repository root.
      - sh: test "{{.BRANCH}}" != HEAD
        msg: Check out a branch first.
      - sh: 'case "{{.BRANCH}}" in develop|main|release/*) exit 1;; esac'
        msg: Baselines for {{.BRANCH}} come from CI only.
      # Argos files the build under HEAD, so it must show HEAD's code.
      - sh: test -z "$(git status --porcelain)"
        msg: Commit your change locally first.
      # Fetched first, as HEAD may have been pushed from another clone.
      - sh: git fetch --quiet origin && test -z "$(git branch -r --contains HEAD)"
        msg: HEAD is already pushed, so CI compares it.
    cmds:
      - task: argos:capture
      # In a node container, where the dependencies' binaries match after the
      # capture. It has no git for the worktree, so the commits come from here.
      # A subset build compares against the baseline but never becomes one.
      - >-
        docker compose {{.DOCKER_COMPOSE_FILES}} run --rm --no-deps
        --user "$(id -u):$(id -g)" --env HOME=/tmp --env ARGOS_TOKEN
        --env ARGOS_COMMIT=$(git rev-parse HEAD) --env ARGOS_BRANCH={{.BRANCH}}
        --env ARGOS_REFERENCE_COMMIT=$(git merge-base HEAD origin/{{.BASE}})
        --env ARGOS_REFERENCE_BRANCH={{.BASE}}
        node corepack pnpm exec argos upload --build-name design-system --subset ./screenshots

  argos:capture:
    summary: |
      Screenshot every story into ./screenshots for Argos. A node container
      builds and serves the static Storybook and runs the tests, with the
      browser in the playwright service, in the image matching the installed
      Playwright, so screenshots render the same on every machine.
    vars:
      PLAYWRIGHT_VERSION:
        sh: >-
          sed -n 's/^  "version": "\([^"]*\)".*/\1/p' node_modules/playwright/package.json
      # The browser reaches the static Storybook by this name.
      CONTAINER: design-system-argos
      COMPOSE: 'docker compose {{.DOCKER_COMPOSE_FILES}} --profile argos'
    cmds:
      - rm -rf screenshots
      - >-
        PLAYWRIGHT_IMAGE_TAG=v{{.PLAYWRIGHT_VERSION}}-noble
        {{.COMPOSE}} up --detach --wait --quiet-pull playwright
      # Removes only the capture's own container: the project is also the
      # developer's running dev setup.
      - defer: '{{.COMPOSE}} rm --stop --force playwright 2> /dev/null'
      # As the calling user, who owns the checkoutD it writes to.
      - >-
        {{.COMPOSE}} run --rm --no-deps --name {{.CONTAINER}}
        --user "$(id -u):$(id -g)" --env HOME=/tmp
        --env PLAYWRIGHT_SERVER=ws://playwright:3000/
        --env NODE_OPTIONS=--experimental-vm-modules
        node sh -c '
        corepack pnpm run css:build && corepack pnpm run build-storybook --quiet &&
        { node_modules/.bin/http-server storybook-static -p 6006 --silent & } &&
        corepack pnpm exec wait-on --timeout 60000 http-get://localhost:6006/index.json &&
        corepack pnpm exec test-storybook --url http://{{.CONTAINER}}:6006 {{.CLI_ARGS}}'

  dev:cli:
    summary: Performs command inside container. Expects parameter(s).
    cmds:
      - docker compose {{ .DOCKER_COMPOSE_FILES }} run --rm node {{.CLI_ARGS}}
