# Removal of the obsolete `branch-*` tags and GitHub releases left behind by
# the old release process. Included into the root Taskfile under the
# `branch-tag-cleanup` namespace, so `list` below is run as
# `task branch-tag-cleanup:list`.
version: '3'

vars:
  BRANCH_TAG_PREFIX: '{{.BRANCH_TAG_PREFIX | default "branch-"}}'
  BRANCH_TAG_REMOTE: '{{.BRANCH_TAG_REMOTE | default "origin"}}'

tasks:
  list:
    desc: "List the obsolete branch-* tags and GitHub releases left behind by the old release process."
    silent: true
    preconditions:
      - sh: command -v gh
        msg: "gh is required. Try: nix shell nixpkgs#gh"
      - sh: gh auth status
        msg: "gh is not authenticated. Run: gh auth login"
      - sh: git remote get-url {{.BRANCH_TAG_REMOTE}}
        msg: "No such git remote: {{.BRANCH_TAG_REMOTE}}"
    cmds:
      - |
        set -eu
        set -o pipefail
        prefix='{{.BRANCH_TAG_PREFIX}}'
        remote='{{.BRANCH_TAG_REMOTE}}'
        # No `git fetch --tags`: some local branch-* tags point at different
        # commits than the remote ones, so a fetch fails with "would clobber
        # existing tag". ls-remote reads the remote refs directly, and
        # deletion is by name, not by SHA.
        # Captured up front, not inlined into the echo below: a `|| true` there
        # would turn an unreachable remote into a confident "0 tags".
        remote_refs=$(git ls-remote --tags "$remote" "refs/tags/${prefix}*") || {
          echo "Could not read tags from '$remote'. Check network and credentials." >&2
          exit 1
        }
        release_tags=$(gh release list --limit 5000 --json tagName -q '.[].tagName') || {
          echo "Could not list GitHub releases. Check 'gh auth status'." >&2
          exit 1
        }
        echo "Remote          : $remote ($(git remote get-url "$remote"))"
        echo "Remote tags     : $(printf '%s\n' "$remote_refs" | grep -vc '\^{}$' || true)"
        echo "Local tags      : $(git tag -l "${prefix}*" | grep -c . || true)"
        echo "GitHub releases : $(printf '%s\n' "$release_tags" | grep -c "^${prefix}" || true)"
        echo "Tags kept       : $(git tag -l | grep -vc "^${prefix}" || true)"
        echo
        echo "First few tags that would go:"
        git tag -l "${prefix}*" | head -5 | sed 's/^/  /'
        echo "  ..."

  backup:
    desc: "Archive the branch-* tags and releases, with a script to restore them. Runs automatically before a prune."
    silent: true
    requires:
      vars: [BACKUP_DIR]
    cmds:
      - |
        set -eu
        set -o pipefail
        prefix='{{.BRANCH_TAG_PREFIX}}'
        remote='{{.BRANCH_TAG_REMOTE}}'
        dir='{{.BACKUP_DIR}}'
        mkdir -p "$dir"
        git ls-remote --tags "$remote" "refs/tags/${prefix}*" \
          | grep -v '\^{}$' | sed 's#\trefs/tags/#\t#' | sort -k2,2 > "$dir/remote-tags.tsv"
        git tag -l "${prefix}*" | sort > "$dir/local-tags.txt"
        gh release list --limit 5000 \
          --json tagName,name,createdAt,publishedAt,isDraft,isPrerelease \
          -q "[.[] | select(.tagName | startswith(\"${prefix}\"))]" > "$dir/releases.json"
        # Plain tag list too, so the prune below needs no jq.
        gh release list --limit 5000 --json tagName -q '.[].tagName' \
          | grep "^${prefix}" > "$dir/release-tags.txt" || true
        # Restore script — only works while the commits are still reachable;
        # GitHub garbage-collects unreachable objects eventually.
        {
          echo '#!/usr/bin/env bash'
          echo '# Recreate the deleted tags, then: git push '"$remote"' --tags'
          echo 'set -euo pipefail'
          awk -F'\t' 'NF==2 {printf "git tag -f %s %s\n", $2, $1}' "$dir/remote-tags.tsv"
        } > "$dir/restore-tags.sh"
        chmod +x "$dir/restore-tags.sh"
        echo "Backup written to $dir"

  prune:
    desc: "Delete every branch-* tag and GitHub release from the old release process. Backs up first, and asks before deleting."
    silent: true
    prompt: "Permanently delete all {{.BRANCH_TAG_PREFIX}}* tags and releases on {{.BRANCH_TAG_REMOTE}}?"
    vars:
      BACKUP_STAMP:
        sh: date +%Y%m%d-%H%M%S
      BACKUP_DIR: '{{.BACKUP_DIR | default (printf "/tmp/branch-tag-backup-%s" .BACKUP_STAMP)}}'
    cmds:
      - task: backup
        vars: { BACKUP_DIR: '{{.BACKUP_DIR}}' }
      - |
        set -eu
        set -o pipefail
        prefix='{{.BRANCH_TAG_PREFIX}}'
        remote='{{.BRANCH_TAG_REMOTE}}'
        dir='{{.BACKUP_DIR}}'

        # Guardrail: refuse to touch anything outside the prefix.
        if cut -f2 "$dir/remote-tags.tsv" | grep -v "^${prefix}" | grep -q .; then
          echo "ABORT: remote tag list contains refs outside '${prefix}'" >&2
          exit 1
        fi
        if grep -v "^${prefix}" "$dir/local-tags.txt" | grep -q .; then
          echo "ABORT: local tag list contains refs outside '${prefix}'" >&2
          exit 1
        fi

        # The backup must actually describe what we are about to delete. A short
        # or empty manifest means git/gh failed while it was written, and
        # deleting on the strength of it would leave nothing to restore from.
        live_remote=$(git ls-remote --tags "$remote" "refs/tags/${prefix}*" | grep -vc '\^{}$' || true)
        have_remote=$(grep -c . "$dir/remote-tags.tsv" || true)
        if [ "$live_remote" != "$have_remote" ]; then
          echo "ABORT: backup lists $have_remote remote tags, but $remote has $live_remote." >&2
          echo "       Re-run the backup and check that git/gh can reach $remote." >&2
          exit 1
        fi
        live_local=$(git tag -l "${prefix}*" | grep -c . || true)
        have_local=$(grep -c . "$dir/local-tags.txt" || true)
        if [ "$live_local" != "$have_local" ]; then
          echo "ABORT: backup lists $have_local local tags, but the repo has $live_local." >&2
          exit 1
        fi

        # Releases first: a release whose tag is gone lingers as an orphan.
        total=$(grep -c . "$dir/release-tags.txt" || true)
        echo "Deleting $total GitHub releases..."
        i=0
        while read -r tag; do
          [ -n "$tag" ] || continue
          i=$((i + 1))
          printf '\r  %d/%d\033[K' "$i" "$total"
          gh release delete "$tag" --yes >/dev/null || printf '\n  FAILED: %s\n' "$tag" >&2
        done < "$dir/release-tags.txt"
        echo

        # Remote tags, batched: a handful of pushes rather than one per tag.
        echo "Deleting remote tags on $remote..."
        cut -f2 "$dir/remote-tags.tsv" | sed 's#^#:refs/tags/#' \
          | xargs -r -n 50 git push "$remote" --

        echo "Deleting local tags..."
        grep . "$dir/local-tags.txt" | xargs -r git tag -d >/dev/null

        echo
        echo "Done. Remaining ${prefix}* tags:"
        echo "  local  : $(git tag -l "${prefix}*" | grep -c . || true)"
        echo "  remote : $(git ls-remote --tags "$remote" "refs/tags/${prefix}*" | grep -vc '\^{}$' || true)"
        echo "  Restore script: $dir/restore-tags.sh"
