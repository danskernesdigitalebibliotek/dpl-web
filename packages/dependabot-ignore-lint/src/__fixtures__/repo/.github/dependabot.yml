version: 2
updates:
  - package-ecosystem: npm
    directories: ["/pnpm", "/no-lock*"]
    ignore:
      - dependency-name: "gone"
        versions: [">=1"]
  - package-ecosystem: npm
    directory: "/pnpm"
    ignore:
      - dependency-name: "alpha"
        versions: [">=1"]
      - dependency-name: "held"
        versions: [">=3"]
      - dependency-name: "gone"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: composer
    directory: "/composer"
    ignore:
      - dependency-name: "acme/gamma"
        versions: [">=1.0.0"]
      - dependency-name: "acme/transitive"
        versions: [">=1.0.0"]
  - package-ecosystem: npm
    directory: "/missing"
    ignore:
      - dependency-name: "alpha"
        versions: [">=1"]
  - package-ecosystem: github-actions
    directory: "/"
    ignore:
      - dependency-name: "actions/checkout"
        versions: [">=1"]
