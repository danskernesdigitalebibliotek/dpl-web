version: '3'

dotenv: [".task.env"]

tasks:
  dev:nvm:use:
    summary: Use project Node.js version with nvm
    silent: true
    cmds:
      - echo "ignoring"
      # - bash -lc 'source "${NVM_DIR:-$HOME/.nvm}/nvm.sh" && nvm install && nvm use'

  dev:install:
    summary: Install packages
    cmds:
      - task dev:nvm:use
      - pnpm install

  dev:start:
    summary: Install and run docker compose
    cmds:
      - docker compose up --detach

  dev:build:
    summary: Build React assets
    cmds:
      - task dev:cli -- corepack pnpm run build

  dev:stop:
    summary: Stop docker compose environment
    cmds:
      - docker compose stop

  dev:up:
    summary: Install run docker compose
    cmds:
      - docker compose up --detach

  dev:down:
    summary: Stop and remove docker compose environment
    cmds:
      # DNS proxies such as Dory may hang on to the network for a bit which
      # causes the process to fail. Wait and retry if that is the case
      - docker compose down --volumes --remove-orphans || (sleep 3 && docker-compose down)

  dev:mocks:start:
    summary: Start wiremocks
    cmds:
      - docker compose up wiremock-fbs --detach
      - docker compose up wiremock-publizon --detach
      - docker compose up wiremock --detach

  dev:mocks:stop:
    summary: Stop wiremocks
    cmds:
      - docker compose stop wiremock-fbs
      - docker compose stop wiremock-publizon
      - docker compose stop wiremock

  dev:storybook:
    summary: Run storybook in development mode
    cmds:
      - task dev:nvm:use
      - pnpm run start:storybook:dev

  dev:reset:
    summary: Install development environment and clean up.
    cmds:
      - task dev:down
      - task dev:nvm:use
      - pnpm run clean
      - task dev:start

  dev:test:
    summary: Run tests
    cmds:
      - task dev:nvm:use
      - pnpm run test

  dev:lint:
    summary: Run linters
    cmds:
      - task dev:nvm:use
      - pnpm run lint:js
      - pnpm run lint:scss
      - pnpm run lint:markdown

  dev:format:
    summary: Run linters, and auto-fix
    cmds:
      - task dev:nvm:use
      - pnpm run lint:js --fix
      - pnpm run lint:scss --fix
      - pnpm run lint:markdown --fix

  codegen:dbc:gateway:
    desc: Regenerate DBC gateway GraphQL client.
    cmds:
      - task dev:nvm:use
      - pnpm run codegen:dbc:gateway

  codegen:rest-services:
    desc: Regenerate REST service clients via orval.
    cmds:
      - task dev:nvm:use
      - pnpm run codegen:rest-services

  codegen:client:fbs:
    desc: Regenerate FBS REST client.
    cmds:
      - task dev:nvm:use
      - pnpm run codegen:client:fbs

  codegen:client:publizon:
    desc: Regenerate Publizon REST client.
    cmds:
      - task dev:nvm:use
      - pnpm run codegen:client:publizon

  codegen:client:dpl-cms:
    desc: Regenerate dpl-cms REST client.
    cmds:
      - task dev:nvm:use
      - pnpm run codegen:client:dpl-cms

  dev:cli:
    summary: Performs command inside container. Expects parameter(s).
    env:
      UID:
        sh: id -u
      GID:
        sh: id -g
    cmds:
      - docker compose run --rm node {{.CLI_ARGS}}
