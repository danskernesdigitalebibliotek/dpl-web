query getMaterial($wid: String!) {
  work(id: $wid) {
    ...WorkMedium
  }
}

query getMaterialGlobally($wid: String!) {
  work(id: $wid) {
    ...WorkMedium
  }
}

query getRetriever($id: String!) {
  retriever(id: $id) {
    error
    article {
      headline
      subHeadline
      publishingDate
      sourceName
      fullTextHtml
    }
  }
}

query getReviewManifestations($pid: [String!]!) {
  manifestations(pid: $pid) {
    ...ManifestationReviewFields
  }
}
