query getDashboardRecommendations($faust: String, $id: String, $limit: Int!) {
  recommend(faust: $faust, id: $id, limit: $limit) {
    result {
      work {
        workId
        titles {
          full
        }
        creators {
          display
        }
        manifestations {
          bestRepresentation {
            cover {
              large {
                url
              }
            }
          }
        }
      }
    }
  }
  work(faust: $faust, id: $id) {
    titles {
      full
    }
  }
}
