# Other works by the series' author, for the "Mere af {author}" slider. The
# CQL and sort are built in useRelatedWorks.
#
# Deliberately NOT the WorkSmall fragment the member list uses: reached
# through a work, series carries the work's own numberInSeries directly,
# where WorkSmall's SeriesSimple pulls each series' entire member list - far
# more response than a strip of covers needs.
query getRelatedWorks(
  $cql: String!
  $offset: Int!
  $limit: PaginationLimitScalar!
  $filters: ComplexSearchFiltersInput!
  $sort: [SortInput!]
) {
  complexSearch(cql: $cql, filters: $filters) {
    works(offset: $offset, limit: $limit, sort: $sort) {
      workId
      titles {
        full
      }
      creators {
        display
      }
      workYear {
        year
      }
      series {
        seriesId
        title
        # This work's own place in the series, pre-labelled ("Del 1") like on
        # the members list.
        numberInSeries
        readThisFirst
      }
      manifestations {
        bestRepresentation {
          pid
        }
      }
    }
  }
}
