query searchFacet(
  $q: SearchQueryInput!
  $facets: [FacetFieldEnum!]!
  $facetLimit: Int!
  $filters: SearchFiltersInput
  $includeOnlineMaterials: Boolean! = true
) {
  search(
    q: $q
    filters: $filters
    includeOnlineMaterials: $includeOnlineMaterials
  ) {
    facets(facets: $facets) {
      name
      type
      values(limit: $facetLimit) {
        key
        term
        score
        traceId
      }
    }
  }
}
